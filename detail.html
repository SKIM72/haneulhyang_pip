<!DOCTYPE html>
<html lang="ko">
<head>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#17341c", "on-secondary-fixed": "#1c1c19", "inverse-surface": "#313030", "surface-tint": "#47664a",
                        "on-background": "#1c1b1b", "on-surface": "#1c1b1b", "on-primary-container": "#98ba99", "surface-container": "#f0eded",
                        "error-container": "#ffdad6", "inverse-primary": "#adcfad", "inverse-on-surface": "#f3f0ef", "surface-dim": "#dcd9d9",
                        "on-secondary-fixed-variant": "#474743", "on-primary-fixed-variant": "#2f4e33", "secondary": "#5f5e5b",

                        "secondary-container": "#e5e2dd", "tertiary": "#41271f", "on-secondary": "#ffffff", "surface-container-lowest": "#ffffff",
                        "outline": "#737971", "error": "#ba1a1a", "tertiary-fixed": "#ffdbd0", "outline-variant": "#c2c8bf",
                        "on-error-container": "#93000a", "secondary-fixed": "#e5e2dd", "surface": "#fcf9f8", "on-error": "#ffffff",
                        "tertiary-container": "#5a3d34", "on-tertiary-fixed": "#2c160e", "secondary-fixed-dim": "#c9c6c2",
                        "on-surface-variant": "#424841", "on-tertiary-container": "#d0a99d", "surface-variant": "#e5e2e1",
                        "primary-container": "#2d4b31", "tertiary-fixed-dim": "#e7bdb1", "on-secondary-container": "#656461",
                        "primary-fixed": "#c8ecc8", "primary-fixed-dim": "#adcfad", "on-tertiary-fixed-variant": "#5d4037",
                        "on-tertiary": "#ffffff", "on-primary": "#ffffff", "surface-container-highest": "#e5e2e1", "surface-bright": "#fcf9f8"
                    },
                    "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem", "2xl": "1rem" },
                    "spacing": { "margin-mobile": "20px", "margin-desktop": "64px", "gutter": "24px", "base": "8px", "container-max": "1200px" },
                    "fontFamily": {
                        "headline-lg": ["EB Garamond", "Noto Serif KR", "serif"], 
                        "label-lg": ["Hanken Grotesk"], 
                        "body-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["EB Garamond", "Noto Serif KR", "serif"], 
                        "label-sm": ["Hanken Grotesk"], 
                        "headline-md": ["EB Garamond", "Noto Serif KR", "serif"],
                        "display-lg": ["EB Garamond", "Noto Serif KR", "serif"], 
                        "body-md": ["Hanken Grotesk"]
                    }
                }
            }
        }
    </script>
    <style>
        .headline-font { font-family: 'EB Garamond', serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .ambient-shadow { box-shadow: 0 24px 48px rgba(27, 61, 47, 0.08); }
        .reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.5, 0, 0, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        
        .post-body { color: #2c2c2c; font-size: 0.95rem; line-height: 1.6; font-family: 'Hanken Grotesk', sans-serif; }
        .post-body p { margin-bottom: 1rem; }
        .post-body img { border-radius: 0.75rem; margin: 1.25rem auto; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 90%; }
        .post-body h1, .post-body h2 { font-family: 'EB Garamond', 'Noto Serif KR', serif; color: #17341c; margin-top: 1.5rem; margin-bottom: 0.75rem; }
        .post-body h1 { font-size: 1.25rem; font-weight: bold; }
        .post-body h2 { font-size: 1.1rem; font-weight: bold; }
        .post-body ul { list-style: disc; padding-left: 1.5rem; margin-bottom: 1.25rem; }
        .post-body ol { list-style: decimal; padding-left: 1.5rem; margin-bottom: 1.25rem; }
        .korean-serif { font-family: 'EB Garamond', 'Noto Serif KR', serif !important; }
    </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased overflow-x-hidden flex flex-col min-h-screen">

    <nav class="fixed top-0 inset-x-0 w-full z-50 bg-background/80 backdrop-blur-md border-b border-outline-variant/30">
        <div class="relative flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 max-w-container-max mx-auto w-full">
            <a class="flex items-center gap-3 z-10 hover:opacity-90 transition-opacity" href="index.html">
                <div class="h-12 w-12 md:h-14 md:w-14 rounded-2xl overflow-hidden bg-white shadow-sm border border-outline-variant/20 shrink-0">
                    <img alt="하늘향 로고" class="h-full w-full object-cover p-1" src="./assets/icon1.png"/>
                </div>
                <span class="headline-font text-base md:text-lg font-bold text-primary tracking-wider">하늘향</span>
            </a>
            
            <div class="absolute inset-x-0 flex justify-center items-center pointer-events-none">
                <a href="index.html" class="pointer-events-auto font-label-lg text-label-lg tracking-widest text-primary hover:opacity-80 transition-opacity">목록으로</a>
            </div>
            
            <div class="flex justify-end items-center z-10">
                <a href="https://www.band.us/band/67603330" target="_blank" rel="noopener noreferrer" class="group block w-9 h-9 md:w-11 md:h-11 transition-transform duration-300 hover:scale-110" title="하늘향 밴드 바로가기">
                    <img src="./assets/band.png" alt="네이버 밴드" class="w-full h-full object-contain block group-hover:hidden">
                    <img src="./assets/band_hover.png" alt="네이버 밴드" class="w-full h-full object-contain hidden group-hover:block">
                </a>
            </div>
            
        </div>
    </nav>

    <main class="flex-1 pt-[100px] md:pt-[120px]">
        <div id="loadingIndicator" class="text-center py-24">
            <span class="material-symbols-outlined text-4xl text-outline-variant animate-pulse mb-4">hourglass_empty</span>
            <p class="font-body-md text-on-surface-variant">소개글을 불러오는 중입니다...</p>
        </div>

        <div id="errorState" class="hidden text-center py-24 max-w-container-max mx-auto">
            <h2 class="font-headline-md text-error mb-2">페이지를 찾을 수 없습니다</h2>
            <a href="index.html" class="font-label-lg text-primary underline">홈으로 돌아가기</a>
        </div>

        <article id="postArticle" class="hidden">
            <section class="reveal px-margin-mobile md:px-margin-desktop py-12 md:py-16 max-w-container-max mx-auto text-center flex flex-col items-center">
                <div class="inline-flex items-center justify-center px-4 py-1 mb-4 border border-primary/20 rounded-full bg-surface-container-lowest/50">
                    <span id="postDate" class="font-label-sm text-xs text-primary tracking-widest uppercase"></span>
                </div>
                <h1 id="postTitle" class="korean-serif text-2xl md:text-3xl lg:text-4xl text-primary max-w-3xl mx-auto mb-4 leading-tight"></h1>
            </section>

            <section class="px-margin-mobile md:px-margin-desktop pb-20 max-w-container-max mx-auto">
                <h2 class="reveal korean-serif text-xl md:text-2xl text-primary mb-6 text-center md:text-left border-b border-outline-variant/30 pb-3">
                    성장 이야기 (Growth Story)
                </h2>
                <div id="growthDynamicRender"></div>
            </section>
            
            <section class="bg-surface-container-lowest py-16 md:py-20 px-margin-mobile md:px-margin-desktop border-t border-surface-container-low">
                <div class="max-w-4xl mx-auto">
                    <div class="text-center mb-10 reveal">
                        <span class="text-[10px] font-bold text-primary tracking-widest uppercase mb-1.5 block">Usage Guide</span>
                        <h2 class="korean-serif text-2xl md:text-3xl text-primary mb-4">하늘향 제품 활용법</h2>
                        <div class="w-10 h-0.5 bg-primary/30 mx-auto"></div>
                    </div>
                    
                    <div id="usageRender" class="reveal"></div>
                </div>
            </section>
        </article>
    </main>

    <footer class="w-full py-12 px-margin-mobile md:px-margin-desktop flex flex-col items-center text-center gap-6 bg-surface-container-lowest border-t border-surface-container-low mt-auto">
        <div class="flex flex-col items-center gap-4">
            <a class="block h-14 w-14 rounded-2xl overflow-hidden bg-white shadow-sm border border-outline-variant/20" href="index.html">
                <img alt="하늘향 로고" class="h-full w-full object-cover p-1" src="./assets/icon1.png"/>
            </a>
            <span class="font-body-md text-sm text-secondary">© 2026 하늘향 PREMIUM WELLNESS. ALL RIGHTS RESERVED.</span>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = "https://eyoahkbqfxcisvmkvikp.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5b2Foa2JxZnhjaXN2bWt2aWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NDAzODUsImV4cCI6MjA5NTAxNjM4NX0.-JgH5ACzfq-d96VXEZlXovXx0w_uR3gJiwonaushah8";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function initScrollReveal() {
            setTimeout(() => {
                const reveals = document.querySelectorAll(".reveal");
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('active'); observer.unobserve(entry.target); } });
                }, { threshold: 0.1 });
                reveals.forEach(el => observer.observe(el));
            }, 100);
        }

        async function loadPostDetail() {
            const postId = new URLSearchParams(window.location.search).get('id');
            if (!postId) { document.getElementById('loadingIndicator').classList.add('hidden'); document.getElementById('errorState').classList.remove('hidden'); return; }

            try {
                const { data: post, error } = await supabaseClient.from('posts').select('*').eq('id', postId).eq('status', 'published').single();
                document.getElementById('loadingIndicator').classList.add('hidden');
                if (error || !post) { document.getElementById('errorState').classList.remove('hidden'); return; }

                document.getElementById('postTitle').innerText = post.title;
                document.getElementById('postDate').innerText = new Date(post.created_at).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
                
                const targetRender = document.getElementById('growthDynamicRender');
                try {
                    const growthData = JSON.parse(post.content_growth);
                    const steps = growthData.steps || [];

                    targetRender.className = "flex flex-col gap-8 md:gap-12 relative max-w-4xl mx-auto";
                    const timelineLine = '<div class="hidden md:block absolute left-1/2 top-0 bottom-0 w-[1px] bg-outline-variant/30 transform -translate-x-1/2 z-0"></div>';
                    
                    const timelineContent = steps.map((step, index) => {
                        const isEven = index % 2 === 0;
                        if (isEven) {
                            return `
                                <div class="reveal flex flex-col md:flex-row items-center gap-6 md:gap-8 relative z-10">
                                    <div class="w-full md:w-1/2 md:text-right md:pr-4">
                                        <span class="inline-block px-2.5 py-0.5 bg-secondary-container/50 text-on-secondary-container rounded-full font-label-sm text-[0.7rem] font-bold mb-2 tracking-wider">STEP 0${index + 1}</span>
                                        <h3 class="korean-serif text-lg md:text-xl text-primary mb-2">${step.title || ''}</h3>
                                        <p class="font-body-md text-sm md:text-base text-on-surface-variant leading-relaxed">${(step.desc || '').replace(/\n/g, '<br>')}</p>
                                    </div>
                                    <div class="w-full md:w-1/2">
                                        <div class="aspect-[4/3] rounded-xl overflow-hidden ambient-shadow max-w-[400px] mx-auto md:ml-4 md:mr-auto">
                                            <img alt="${step.title || ''}" class="w-full h-full object-cover" src="${step.img || './assets/icon1.png'}"/>
                                        </div>
                                    </div>
                                </div>
                            `;
                        } else {
                            return `
                                <div class="reveal flex flex-col md:flex-row-reverse items-center gap-6 md:gap-8 relative z-10">
                                    <div class="w-full md:w-1/2 md:text-left md:pl-4">
                                        <span class="inline-block px-2.5 py-0.5 bg-secondary-container/50 text-on-secondary-container rounded-full font-label-sm text-[0.7rem] font-bold mb-2 tracking-wider">STEP 0${index + 1}</span>
                                        <h3 class="korean-serif text-lg md:text-xl text-primary mb-2">${step.title || ''}</h3>
                                        <p class="font-body-md text-sm md:text-base text-on-surface-variant leading-relaxed">${(step.desc || '').replace(/\n/g, '<br>')}</p>
                                    </div>
                                    <div class="w-full md:w-1/2">
                                        <div class="aspect-[4/3] rounded-xl overflow-hidden ambient-shadow max-w-[400px] mx-auto md:mr-4 md:ml-auto">
                                            <img alt="${step.title || ''}" class="w-full h-full object-cover" src="${step.img || './assets/icon1.png'}"/>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }
                    }).join('');
                    targetRender.innerHTML = timelineLine + timelineContent;
                } catch (e) { targetRender.innerHTML = `<div class="post-body bg-surface p-6 rounded-xl">${post.content_growth}</div>`; }

                const usageRender = document.getElementById('usageRender');
                try {
                    const usageData = JSON.parse(post.content_usage);
                    if (Array.isArray(usageData) && usageData.length > 0) {
                        usageRender.className = "grid grid-cols-1 sm:grid-cols-2 gap-6 mt-6";
                        usageRender.innerHTML = usageData.map((use, i) => `
                            <div class="group flex flex-col bg-surface rounded-[1.25rem] overflow-hidden border border-outline-variant/30 ambient-shadow hover:-translate-y-1 hover:shadow-xl transition-all duration-300">
                                <div class="aspect-video bg-surface-variant overflow-hidden relative border-b border-outline-variant/20">
                                    <img src="${use.img || './assets/icon1.png'}" alt="${use.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                                    <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm px-2.5 py-1 rounded-lg text-[0.7rem] font-bold text-primary shadow-sm tracking-wider">
                                        POINT 0${i+1}
                                    </div>
                                </div>
                                <div class="p-5 md:p-6 flex-1 flex flex-col bg-white">
                                    <h3 class="korean-serif text-lg md:text-xl text-primary font-bold mb-2 group-hover:text-surface-tint transition-colors">${use.title}</h3>
                                    <p class="font-body-md text-sm text-on-surface-variant leading-relaxed flex-1">${(use.desc || '').replace(/\n/g, '<br>')}</p>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        usageRender.className = "relative bg-surface p-6 md:p-8 rounded-[1.5rem] border border-outline-variant/20 ambient-shadow";
                        usageRender.innerHTML = '<p class="text-center text-outline text-sm">등록된 활용법이 없습니다.</p>';
                    }
                } catch (e) {
                    usageRender.className = "relative bg-surface p-6 md:p-8 rounded-[1.5rem] border border-outline-variant/20 ambient-shadow post-body";
                    usageRender.innerHTML = post.content_usage || '<p class="text-center text-outline text-sm">등록된 안내가 없습니다.</p>';
                }

                document.title = `하늘향 - ${post.title}`;
                document.getElementById('postArticle').classList.remove('hidden');
                initScrollReveal();

            } catch (error) { document.getElementById('errorState').classList.remove('hidden'); }
        }
        document.addEventListener('DOMContentLoaded', loadPostDetail);
    </script>
</body>
</html>
