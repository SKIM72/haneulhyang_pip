        function initScrollReveal() {
            setTimeout(() => {
                const reveals = document.querySelectorAll(".reveal");
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('active'); observer.unobserve(entry.target); } });
                }, { threshold: 0.1 });
                reveals.forEach(el => observer.observe(el));
            }, 100);
        }

        // 스크롤 속도와 Easing을 직접 제어하는 커스텀 애니메이션 함수
        function smoothScrollTo(element, targetLeft, duration) {
            element.dataset.isAnimating = 'true'; // 스크립트 애니메이션 상태 기록
            const startLeft = element.scrollLeft;
            const distance = targetLeft - startLeft;
            let startTime = null;

            // 스크롤이 넘어가는 동안 CSS snap 기능이 애니메이션을 방해하지 않도록 임시 해제
            element.style.scrollSnapType = 'none';

            function animation(currentTime) {
                if (startTime === null) startTime = currentTime;
                const timeElapsed = currentTime - startTime;
                const progress = Math.min(timeElapsed / duration, 1);
                
                // easeInOutCubic 알고리즘: 처음엔 천천히, 중간에 빨라졌다, 끝에 다시 천천히 멈춤
                const ease = progress < 0.5 
                    ? 4 * progress * progress * progress 
                    : 1 - Math.pow(-2 * progress + 2, 3) / 2;

                element.scrollLeft = startLeft + distance * ease;

                if (timeElapsed < duration) {
                    requestAnimationFrame(animation);
                } else {
                    // 애니메이션이 끝나면 사용자가 직접 넘길 때를 위해 snap 다시 켬
                    element.style.scrollSnapType = '';
                    setTimeout(() => { element.dataset.isAnimating = 'false'; }, 50); // 오차 방지 지연 해제
                }
            }
            requestAnimationFrame(animation);
        }

        function initAutoSlide() {
            const containers = document.querySelectorAll('.auto-slide-container');
            containers.forEach(container => {
                const parent = container.parentElement;
                const dots = parent.querySelectorAll('.indicator-dot');
                const prevBtn = parent.querySelector('.nav-prev');
                const nextBtn = parent.querySelector('.nav-next');
                const duration = 500; // 화살표 클릭 시 넘어가는 속도 (0.5초)

                // 1. 스크롤 연동 (모바일 스와이프 & 데스크탑 클릭 공통)
                if (dots.length) {
                    container.addEventListener('scroll', () => {
                        const scrollLeft = container.scrollLeft;
                        const slideWidth = container.clientWidth;
                        const currentIndex = Math.round(scrollLeft / slideWidth);

                        dots.forEach((dot, index) => {
                            if (index === currentIndex) {
                                dot.classList.remove('bg-white/40');
                                dot.classList.add('bg-white', 'scale-125');
                            } else {
                                dot.classList.remove('bg-white', 'scale-125');
                                dot.classList.add('bg-white/40');
                            }
                        });
                    }, { passive: true });
                }

                // 2. 데스크탑 좌우 화살표 버튼 클릭 이벤트
                if (prevBtn && nextBtn) {
                    prevBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        const targetLeft = container.scrollLeft - container.clientWidth;
                        // 0 미만으로 넘어가지 않도록 방지
                        smoothScrollTo(container, Math.max(0, targetLeft), duration);
                    });

                    nextBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        const targetLeft = container.scrollLeft + container.clientWidth;
                        const maxScroll = container.scrollWidth - container.clientWidth;
                        // 최대 스크롤 영역을 넘지 않도록 방지
                        smoothScrollTo(container, Math.min(maxScroll, targetLeft), duration);
                    });
                }
            });
        }

        async function loadPostDetail() {
            const postId = new URLSearchParams(window.location.search).get('id');
            if (!postId) { document.getElementById('loadingIndicator').classList.add('hidden'); document.getElementById('errorState').classList.remove('hidden'); return; }

            try {
                const { data: post, error } = await supabaseClient.from('posts').select('*').eq('id', postId).eq('status', 'published').single();
                document.getElementById('loadingIndicator').classList.add('hidden');
                if (error || !post) { document.getElementById('errorState').classList.remove('hidden'); return; }

                document.getElementById('postTitle').innerText = post.title;
                document.getElementById('postDate').innerText = new Date(post.created_at).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
                
                const targetRender = document.getElementById('growthDynamicRender');
                try {
                    const growthData = JSON.parse(post.content_growth);
                    const steps = growthData.steps || [];
                    const layoutType = growthData.layout || 'zigzag';

                    const renderImages = (images, title) => {
                        if(images.length === 1) {
                            return `<img alt="${title || ''}" class="w-full h-full object-cover" src="${images[0]}"/>`;
                        } else {
                            return `
                                <!-- 전체 영역을 감싸는 group 추가 (마우스 호버 시 버튼 표시용) -->
                                <div class="w-full h-full relative group/slider">
                                    <div class="flex w-full h-full overflow-x-auto snap-x snap-mandatory scrollbar-hide auto-slide-container">
                                        ${images.map(img => `
                                            <div class="w-full h-full flex-shrink-0 snap-center relative">
                                                <img alt="${title || ''}" class="w-full h-full object-cover" src="${img}"/>
                                            </div>
                                        `).join('')}
                                    </div>
                                    
                                    <!-- 모바일용 스와이프 뱃지 (데스크탑에서는 숨김) -->
                                    <div class="md:hidden absolute top-3 right-3 bg-black/40 text-white text-[0.65rem] font-bold px-2.5 py-1 rounded-full z-20 pointer-events-none backdrop-blur-sm shadow-sm flex items-center gap-1">
                                        <span class="material-symbols-outlined text-[12px]">swipe</span> 슬라이드
                                    </div>

                                    <!-- 데스크탑용 좌우 넘김 버튼 (모바일에서는 숨김, 마우스 올릴 때만 표시) -->
                                    <button class="nav-prev hidden md:flex absolute left-3 top-1/2 transform -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white p-1.5 rounded-full z-20 backdrop-blur-sm transition-all duration-300 items-center justify-center opacity-0 group-hover/slider:opacity-100 cursor-pointer shadow-md" aria-label="이전 사진">
                                        <span class="material-symbols-outlined text-xl">chevron_left</span>
                                    </button>
                                    <button class="nav-next hidden md:flex absolute right-3 top-1/2 transform -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white p-1.5 rounded-full z-20 backdrop-blur-sm transition-all duration-300 items-center justify-center opacity-0 group-hover/slider:opacity-100 cursor-pointer shadow-md" aria-label="다음 사진">
                                        <span class="material-symbols-outlined text-xl">chevron_right</span>
                                    </button>

                                    <!-- 하단 인디케이터(점) -->
                                    <div class="absolute bottom-3 left-1/2 transform -translate-x-1/2 flex gap-1.5 z-20 pointer-events-none">
                                        ${images.map((_, i) => `
                                            <div class="indicator-dot w-2 h-2 rounded-full transition-all duration-300 ${i === 0 ? 'bg-white scale-125' : 'bg-white/40'}"></div>
                                        `).join('')}
                                    </div>
                                </div>
                            `;
                        }
                    };

                    if (layoutType === 'bento') {
                        targetRender.className = "grid grid-cols-1 md:grid-cols-2 gap-6 relative max-w-4xl mx-auto";
                        const bentoContent = steps.map((step, index) => {
                            const images = step.images && step.images.length > 0 ? step.images : (step.img ? [step.img] : ['./assets/icon1.png']);
                            const aspectClass = step.aspect === 'portrait' ? 'aspect-[3/4]' : 'aspect-[4/3]';
                            const colSpanClass = (index % 3 === 0) ? 'md:col-span-2 flex flex-col md:flex-row' : 'col-span-1 flex flex-col';
                            const imgContainerClass = (index % 3 === 0) ? 'w-full md:w-1/2' : 'w-full';
                            const textContainerClass = (index % 3 === 0) ? 'w-full md:w-1/2 md:pl-6 md:justify-center pt-4 md:pt-0' : 'w-full pt-4';

                            return `
                                <div class="${colSpanClass} reveal bg-surface p-6 rounded-[1.5rem] border border-outline-variant/30 ambient-shadow group hover:-translate-y-1 transition-all">
                                    <div class="${imgContainerClass}">
                                        <div class="relative ${aspectClass} rounded-xl overflow-hidden bg-surface-variant w-full mx-auto">
                                            ${renderImages(images, step.title)}
                                        </div>
                                    </div>
                                    <div class="${textContainerClass} flex flex-col gap-2">
                                        <span class="inline-block px-3 py-1 bg-secondary-container/50 text-on-secondary-container rounded-full font-label-sm text-[0.7rem] font-bold tracking-wider w-max mb-1">STEP 0${index + 1}</span>
                                        <h3 class="korean-serif text-xl md:text-2xl text-primary font-bold group-hover:text-surface-tint transition-colors">${step.title || ''}</h3>
                                        <p class="font-body-md text-sm md:text-base text-on-surface-variant leading-relaxed">${(step.desc || '').replace(/\n/g, '<br>')}</p>
                                    </div>
                                </div>
                            `;
                        }).join('');
                        targetRender.innerHTML = bentoContent;
                        
                        // 요소가 화면에 그려진 후 슬라이드 이벤트 부착
                        initAutoSlide();

                    } else {
                        targetRender.className = "flex flex-col gap-8 md:gap-12 relative max-w-4xl mx-auto";
                        const timelineLine = '<div class="hidden md:block absolute left-1/2 top-0 bottom-0 w-[1px] bg-outline-variant/30 transform -translate-x-1/2 z-0"></div>';
                        
                        const timelineContent = steps.map((step, index) => {
                            const isEven = index % 2 === 0;
                            const images = step.images && step.images.length > 0 ? step.images : (step.img ? [step.img] : ['./assets/icon1.png']);
                            const aspect = step.aspect || 'landscape';
                            const aspectClass = aspect === 'portrait' ? 'aspect-[3/4] max-w-[300px]' : 'aspect-[4/3] max-w-[400px]';

                            if (isEven) {
                                return `
                                    <div class="reveal flex flex-col md:flex-row items-center gap-6 md:gap-8 relative z-10">
                                        <div class="w-full md:w-1/2 md:text-right md:pr-4">
                                            <span class="inline-block px-2.5 py-0.5 bg-secondary-container/50 text-on-secondary-container rounded-full font-label-sm text-[0.7rem] font-bold mb-2 tracking-wider">STEP 0${index + 1}</span>
                                            <h3 class="korean-serif text-lg md:text-xl text-primary mb-2">${step.title || ''}</h3>
                                            <p class="font-body-md text-sm md:text-base text-on-surface-variant leading-relaxed">${(step.desc || '').replace(/\n/g, '<br>')}</p>
                                        </div>
                                        <div class="w-full md:w-1/2">
                                            <div class="relative ${aspectClass} rounded-xl overflow-hidden ambient-shadow mx-auto md:ml-4 md:mr-auto transition-all">
                                                ${renderImages(images, step.title)}
                                            </div>
                                        </div>
                                    </div>
                                `;
                            } else {
                                return `
                                    <div class="reveal flex flex-col md:flex-row-reverse items-center gap-6 md:gap-8 relative z-10">
                                        <div class="w-full md:w-1/2 md:text-left md:pl-4">
                                            <span class="inline-block px-2.5 py-0.5 bg-secondary-container/50 text-on-secondary-container rounded-full font-label-sm text-[0.7rem] font-bold mb-2 tracking-wider">STEP 0${index + 1}</span>
                                            <h3 class="korean-serif text-lg md:text-xl text-primary mb-2">${step.title || ''}</h3>
                                            <p class="font-body-md text-sm md:text-base text-on-surface-variant leading-relaxed">${(step.desc || '').replace(/\n/g, '<br>')}</p>
                                        </div>
                                        <div class="w-full md:w-1/2">
                                            <div class="relative ${aspectClass} rounded-xl overflow-hidden ambient-shadow mx-auto md:mr-4 md:ml-auto transition-all">
                                                ${renderImages(images, step.title)}
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }
                        }).join('');
                        targetRender.innerHTML = timelineLine + timelineContent;
                        
                        // 요소가 화면에 그려진 후 슬라이드 이벤트 부착
                        initAutoSlide();
                    }
                } catch (e) { targetRender.innerHTML = `<div class="post-body bg-surface p-6 rounded-xl">${post.content_growth}</div>`; }

                const usageRender = document.getElementById('usageRender');
                try {
                    const usageData = JSON.parse(post.content_usage);
                    if (Array.isArray(usageData) && usageData.length > 0) {
                        usageRender.className = "grid grid-cols-1 sm:grid-cols-2 gap-6 mt-6";
                        usageRender.innerHTML = usageData.map((use, i) => `
                            <div class="group flex flex-col bg-surface rounded-[1.25rem] overflow-hidden border border-outline-variant/30 ambient-shadow hover:-translate-y-1 hover:shadow-xl transition-all duration-300">
                                <div class="aspect-video bg-surface-variant overflow-hidden relative border-b border-outline-variant/20">
                                    <img src="${use.img || './assets/icon1.png'}" alt="${use.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                                    <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm px-2.5 py-1 rounded-lg text-[0.7rem] font-bold text-primary shadow-sm tracking-wider">
                                        POINT 0${i+1}
                                    </div>
                                </div>
                                <div class="p-5 md:p-6 flex-1 flex flex-col bg-white">
                                    <h3 class="korean-serif text-lg md:text-xl text-primary font-bold mb-2 group-hover:text-surface-tint transition-colors">${use.title}</h3>
                                    <p class="font-body-md text-sm text-on-surface-variant leading-relaxed flex-1">${(use.desc || '').replace(/\n/g, '<br>')}</p>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        usageRender.className = "relative bg-surface p-6 md:p-8 rounded-[1.5rem] border border-outline-variant/20 ambient-shadow";
                        usageRender.innerHTML = '<p class="text-center text-outline text-sm">등록된 활용법이 없습니다.</p>';
                    }
                } catch (e) {
                    usageRender.className = "relative bg-surface p-6 md:p-8 rounded-[1.5rem] border border-outline-variant/20 ambient-shadow post-body";
                    usageRender.innerHTML = post.content_usage || '<p class="text-center text-outline text-sm">등록된 안내가 없습니다.</p>';
                }

                document.title = `하늘향 - ${post.title}`;
                document.getElementById('postArticle').classList.remove('hidden');
                initScrollReveal();

            } catch (error) { document.getElementById('errorState').classList.remove('hidden'); }
        }
        document.addEventListener('DOMContentLoaded', loadPostDetail);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => console.log('ServiceWorker registration successful'))
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }
    </script>
</body>
</html>
