<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>하늘향 - 제품 상세소개</title>
    
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script id="tailwind-config">
        tailwind.config = {
            theme: { extend: { colors: { "primary": "#17341c", "background": "#fcf9f8", "surface": "#ffffff", "on-background": "#1c1b1b", "on-surface-variant": "#424841", "outline-variant": "#c2c8bf" }, fontFamily: { "headline": ["EB Garamond"], "body": ["Hanken Grotesk"] } } }
        }
    </script>
    <style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
        .headline-font { font-family: 'EB Garamond', serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .post-body { line-height: 1.8; color: #1c1b1b; font-size: 1.05rem; }
        .post-body img { max-width: 100%; border-radius: 0.75rem; margin: 1.5rem auto; display: block; box-shadow: 0 12px 32px rgba(27, 61, 47, 0.05); }
        .post-body p { margin-bottom: 1.2rem; }
        .post-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.2rem; }
        .post-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1.2rem; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">

    <nav class="fixed top-0 w-full z-50 bg-background/90 backdrop-blur-md border-b border-outline-variant/30">
        <div class="flex items-center px-6 py-4 max-w-4xl mx-auto relative">
            <div class="flex items-center gap-4 flex-1">
                <a href="index.html" class="block h-14 w-14 rounded-full overflow-hidden bg-white shadow-sm">
                    <img src="./assets/icon1.png" alt="하늘향 로고" class="h-full w-full object-contain p-1">
                </a>
                <span class="headline-font font-bold text-xl text-primary tracking-wider hidden sm:block">하늘향</span>
            </div>
            <div class="absolute left-1/2 -translate-x-1/2 flex items-center justify-center">
                <a href="index.html" class="text-sm font-bold text-primary flex items-center gap-1 bg-primary/5 px-4 py-1.5 rounded-full hover:bg-primary/10 transition-colors">
                    <span class="material-symbols-outlined text-base">list</span> 목록으로 돌아가기
                </a>
            </div>
            <div class="flex items-center justify-end flex-1">
                <button class="hidden sm:block bg-primary text-white px-5 py-2 rounded-lg font-bold text-sm tracking-widest hover:opacity-90 transition-opacity">SHOP NOW</button>
            </div>
        </div>
    </nav>

    <main class="flex-1 pt-32 pb-24 px-6 max-w-4xl mx-auto w-full">
        <div id="loadingIndicator" class="text-center py-20">
            <span class="material-symbols-outlined text-4xl text-outline-variant animate-pulse mb-4">hourglass_empty</span>
            <p class="text-outline font-medium">소개글을 매핑 중입니다...</p>
        </div>

        <div id="errorState" class="hidden text-center py-20 bg-red-50 rounded-2xl border border-red-100">
            <span class="material-symbols-outlined text-4xl text-red-400 mb-2">error</span>
            <h2 class="text-lg font-bold text-red-700 mb-1">페이지를 불러올 수 없습니다.</h2>
            <a href="index.html" class="text-sm text-red-600 underline">홈으로 이동</a>
        </div>

        <article id="postArticle" class="hidden space-y-12">
            <header class="text-center">
                <div class="inline-flex items-center gap-2 mb-4">
                    <span class="text-xs font-bold text-outline uppercase tracking-widest">Premium Harvest</span>
                    <span class="w-1 h-1 rounded-full bg-outline-variant"></span>
                    <time id="postDate" class="text-xs font-bold text-primary"></time>
                </div>
                <h1 id="postTitle" class="headline-font text-3xl md:text-4xl lg:text-5xl font-bold text-primary leading-tight mb-6"></h1>
                <div class="w-16 h-0.5 bg-primary/20 mx-auto"></div>
            </header>

            <section class="bg-surface p-6 sm:p-10 rounded-2xl border border-outline-variant/30 shadow-sm">
                <h2 class="text-xl font-bold text-primary mb-8 flex items-center gap-2 border-b border-outline-variant/20 pb-3">
                    <span class="material-symbols-outlined text-green-700">potted_plant</span> 씨앗에서 식탁까지 (Growth Story)
                </h2>
                <div id="growthDynamicRender"></div>
            </section>
            
            <section class="bg-surface p-6 sm:p-10 rounded-2xl border border-outline-variant/30 shadow-sm">
                <h2 class="text-xl font-bold text-primary mb-8 flex items-center gap-2 border-b border-outline-variant/20 pb-3">
                    <span class="material-symbols-outlined text-amber-700">local_cafe</span> 제품 안내 및 100% 활용 가이드 (Usage Guide)
                </h2>
                <div id="usageRender" class="post-body"></div>
            </section>
            
            <div class="text-center pt-6">
                <button class="bg-primary text-white px-8 py-4 rounded-xl font-bold tracking-widest hover:opacity-90 shadow-lg shadow-primary/10">
                    제품 구매하러 가기
                </button>
            </div>
        </article>
    </main>

    <footer class="w-full py-12 px-6 bg-surface border-t border-outline-variant/30 text-center text-sm text-on-surface-variant font-medium mt-auto">
        © 2026 하늘향. ALL RIGHTS RESERVED.
    </footer>

    <script>
        const SUPABASE_URL = "https://eyoahkbqfxcisvmkvikp.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5b2Foa2JxZnhjaXN2bWt2aWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NDAzODUsImV4cCI6MjA5NTAxNjM4NX0.-JgH5ACzfq-d96VXEZlXovXx0w_uR3gJiwonaushah8";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadPostDetail() {
            const postId = new URLSearchParams(window.location.search).get('id');
            if (!postId) { document.getElementById('loadingIndicator').classList.add('hidden'); document.getElementById('errorState').classList.remove('hidden'); return; }

            try {
                const { data: post, error } = await supabaseClient.from('posts').select('*').eq('id', postId).eq('status', 'published').single();
                document.getElementById('loadingIndicator').classList.add('hidden');
                if (error || !post) { document.getElementById('errorState').classList.remove('hidden'); return; }

                document.getElementById('postTitle').innerText = post.title;
                document.getElementById('postDate').innerText = new Date(post.created_at).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
                document.getElementById('usageRender').innerHTML = post.content_usage || '';

                // 💡 JSON 구조 해석기 가동
                const targetRender = document.getElementById('growthDynamicRender');
                try {
                    const growthData = JSON.parse(post.content_growth);
                    const steps = growthData.steps || [];
                    const layout = growthData.layout || 'bento';

                    if (layout === 'bento') {
                        targetRender.className = "grid grid-cols-1 md:grid-cols-3 gap-6 auto-rows-[300px]";
                        targetRender.innerHTML = steps.map((step, index) => {
                            let colSpan = 'md:col-span-1';
                            if (index === 0 || index % 4 === 0) colSpan = 'md:col-span-2';
                            return `
                                <div class="${colSpan} relative rounded-xl overflow-hidden group border border-primary/5 shadow-sm min-h-[300px]">
                                    <img src="${step.img || './assets/icon1.png'}" alt="" class="absolute inset-0 w-full h-full object-cover">
                                    <div class="absolute inset-0 bg-gradient-to-t from-primary/95 via-primary/30 to-transparent"></div>
                                    <div class="absolute bottom-0 left-0 p-6 w-full">
                                        <span class="inline-block px-2.5 py-0.5 mb-2 rounded-full bg-white/20 text-white font-bold text-[10px] tracking-widest">STEP 0${index + 1}</span>
                                        <h3 class="font-bold text-white text-lg mb-1">${step.title || '하늘향 단계 소식'}</h3>
                                        <p class="text-white/90 text-xs line-clamp-2">${step.desc || ''}</p>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    } else {
                        targetRender.className = "flex flex-col gap-12 md:gap-16 relative w-full pt-4";
                        const timelineLine = '<div class="hidden md:block absolute left-1/2 top-0 bottom-0 w-[1px] bg-outline-variant/30 transform -translate-x-1/2 z-0"></div>';
                        const timelineContent = steps.map((step, index) => {
                            const isEven = index % 2 === 0;
                            return `
                                <div class="flex flex-col ${isEven ? 'md:flex-row' : 'md:flex-row-reverse'} items-center gap-6 md:gap-12 relative z-10 w-full">
                                    <div class="w-full md:w-1/2 ${isEven ? 'md:text-right' : 'md:text-left'}">
                                        <span class="inline-block px-3 py-1 bg-primary/10 text-primary rounded-full text-xs font-bold mb-2">STEP ${String(index + 1).padStart(2, '0')}</span>
                                        <h3 class="text-lg font-bold text-primary mb-2">${step.title || '하늘향 단계 소식'}</h3>
                                        <p class="text-sm text-on-surface-variant leading-relaxed">${step.desc || ''}</p>
                                    </div>
                                    <div class="w-full md:w-1/2">
                                        <div class="aspect-[4/3] rounded-xl overflow-hidden shadow-sm border border-outline-variant/20">
                                            <img src="${step.img || './assets/icon1.png'}" alt="" class="w-full h-full object-cover">
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('');
                        targetRender.innerHTML = timelineLine + timelineContent;
                    }
                } catch (e) {
                    targetRender.innerHTML = `<div class="post-body">${post.content_growth}</div>`;
                }

                document.title = `하늘향 - ${post.title}`;
                document.getElementById('postArticle').classList.remove('hidden');
            } catch (error) {
                document.getElementById('errorState').classList.remove('hidden');
            }
        }
        document.addEventListener('DOMContentLoaded', loadPostDetail);
    </script>
</body>
</html>
