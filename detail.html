            darkMode: "class",
            theme: {

                    "colors": {

                        "on-error-container": "#93000a", "secondary-fixed": "#e5e2dd", "surface": "#fcf9f8", "on-error": "#ffffff",

                        "on-surface-variant": "#424841", "on-tertiary-container": "#d0a99d", "surface-variant": "#e5e2e1",
                        "primary-container": "#2d4b31", "tertiary-fixed-dim": "#e7bdb1", "on-secondary-container": "#656461",
                        "primary-fixed": "#c8ecc8", "primary-fixed-dim": "#adcfad", "on-tertiary-fixed-variant": "#5d4037",
                        "on-tertiary": "#ffffff", "on-primary": "#ffffff", "surface-container-highest": "#e5e2e1", "surface-bright": "#fcf9f8"
                    },
                    "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem", "2xl": "1rem" },
                    "spacing": { "margin-mobile": "20px", "margin-desktop": "64px", "gutter": "24px", "base": "8px", "container-max": "1200px" },
                    "fontFamily": {
                        "headline-lg": ["EB Garamond", "Noto Serif KR", "serif"], 
                        "label-lg": ["Hanken Grotesk"], 
                        "body-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["EB Garamond", "Noto Serif KR", "serif"], 
                        "label-sm": ["Hanken Grotesk"], 
                        "headline-md": ["EB Garamond", "Noto Serif KR", "serif"],
                        "display-lg": ["EB Garamond", "Noto Serif KR", "serif"],

    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .ambient-shadow { box-shadow: 0 24px 48px rgba(27, 61, 47, 0.08); }
        .reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.5, 0, 0, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .post-body { color: #2c2c2c; font-size: 1.125rem; line-height: 1.9; font-family: 'Hanken Grotesk', sans-serif; }
        .post-body p { margin-bottom: 1.5rem; }
        .post-body img { border-radius: 1rem; margin: 2rem auto; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .post-body h1, .post-body h2 { font-family: 'EB Garamond', 'Noto Serif KR', serif; color: #17341c; margin-top: 2.5rem; margin-bottom: 1.25rem; }
        .post-body h1 { font-size: 2rem; font-weight: bold; }
        .post-body h2 { font-size: 1.5rem; font-weight: bold; }
        .post-body ul { list-style: disc; padding-left: 1.5rem; margin-bottom: 1.5rem; }
        .post-body ol { list-style: decimal; padding-left: 1.5rem; margin-bottom: 1.5rem; }
        .korean-serif { font-family: 'EB Garamond', 'Noto Serif KR', serif !important; }
    </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased overflow-x-hidden flex flex-col min-h-screen">

    <nav class="fixed top-0 inset-x-0 w-full z-50 bg-background/80 backdrop-blur-md border-b border-outline-variant/30">
        <div class="flex justify-center md:justify-between items-center px-margin-mobile md:px-margin-desktop py-4 max-w-container-max mx-auto w-full">
            
            <button class="md:hidden text-primary p-2 absolute right-margin-mobile">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
            </button>
            
            <ul class="hidden md:flex gap-8 items-center flex-1">
                <li><a class="font-label-lg text-label-lg tracking-widest text-primary border-b-2 border-primary pb-1" href="index.html">STORY</a></li>
                <li><a class="font-label-lg text-label-lg tracking-widest text-on-surface-variant hover:text-primary transition-colors" href="#">USAGE</a></li>
                <li><a class="font-label-lg text-label-lg tracking-widest text-on-surface-variant hover:text-primary transition-colors" href="#">BRAND</a></li>
            </ul>
            
            <a class="block h-16 w-16 md:h-20 md:w-20 rounded-2xl overflow-hidden bg-white shadow-sm border border-outline-variant/20" href="index.html">
                <img alt="하늘향 로고" class="h-full w-full object-cover p-1" src="./assets/icon1.png"/>
            </a>
            
            <div class="hidden md:flex flex-1 justify-end">
                <button class="font-label-lg text-label-lg tracking-widest text-primary hover:opacity-80 transition-opacity">SHOP NOW</button>
            </div>
            
        </div>
    </nav>

    <main class="flex-1 pt-[100px] md:pt-[120px]">
        <div id="loadingIndicator" class="text-center py-24">
            <span class="material-symbols-outlined text-4xl text-outline-variant animate-pulse mb-4">hourglass_empty</span>
            <p class="font-body-md text-on-surface-variant">소개글을 불러오는 중입니다...</p>
        </div>

        <div id="errorState" class="hidden text-center py-24 max-w-container-max mx-auto">
            <h2 class="font-headline-md text-error mb-2">페이지를 찾을 수 없습니다</h2>
            <a href="index.html" class="font-label-lg text-primary underline">홈으로 돌아가기</a>
        </div>

        <article id="postArticle" class="hidden">
            <section class="reveal px-margin-mobile md:px-margin-desktop py-16 md:py-24 max-w-container-max mx-auto text-center flex flex-col items-center">
                <div class="inline-flex items-center justify-center px-4 py-1.5 mb-6 border border-primary/20 rounded-full bg-surface-container-lowest/50">
                    <span id="postDate" class="font-label-sm text-label-sm text-primary tracking-widest uppercase"></span>
                </div>
                <h1 id="postTitle" class="korean-serif font-headline-lg-mobile md:font-display-lg text-primary max-w-3xl mx-auto mb-6 leading-tight"></h1>
            </section>

            <section class="px-margin-mobile md:px-margin-desktop pb-24 max-w-container-max mx-auto">
                <h2 class="reveal korean-serif text-3xl md:text-4xl text-primary mb-12 text-center md:text-left border-b border-outline-variant/30 pb-4">
                    성장 이야기 (Growth Story)
                </h2>
                <div id="growthDynamicRender"></div>
            </section>
            
            <section class="bg-surface-container-lowest py-24 px-margin-mobile md:px-margin-desktop border-t border-surface-container-low">
                <div class="max-w-4xl mx-auto">
                    <div class="text-center mb-16 reveal">
                        <span class="font-label-lg text-primary tracking-widest uppercase mb-3 block">Usage Guide</span>
                        <h2 class="korean-serif text-4xl md:text-5xl text-primary mb-6">하늘향 제품 100% 활용법</h2>
                        <div class="w-12 h-0.5 bg-primary/30 mx-auto"></div>
                    </div>
                    
                    <div class="relative bg-surface p-10 md:p-16 rounded-[2rem] border border-outline-variant/20 ambient-shadow reveal">
                        <div class="absolute top-0 left-10 w-16 h-1.5 bg-primary rounded-b-md"></div>
                        <div id="usageRender" class="post-body"></div>
                    </div>
                </div>
            </section>
        </article>
    </main>

    <footer class="w-full py-16 px-margin-mobile md:px-margin-desktop flex flex-col items-center text-center gap-8 bg-surface-container-lowest border-t border-surface-container-low mt-auto">
        <div class="flex flex-col items-center gap-6">
            <a class="block h-20 w-20 rounded-2xl overflow-hidden bg-white shadow-md border border-outline-variant/20" href="index.html">
                <img alt="하늘향 로고" class="h-full w-full object-cover p-1" src="./assets/icon1.png"/>
            </a>
            <span class="font-body-md text-body-md text-secondary">© 2026 하늘향 PREMIUM WELLNESS. ALL RIGHTS RESERVED.</span>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = "https://eyoahkbqfxcisvmkvikp.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5b2Foa2JxZnhjaXN2bWt2aWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NDAzODUsImV4cCI6MjA5NTAxNjM4NX0.-JgH5ACzfq-d96VXEZlXovXx0w_uR3gJiwonaushah8";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function initScrollReveal() {
            setTimeout(() => {
                const reveals = document.querySelectorAll(".reveal");
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('active'); observer.unobserve(entry.target); } });
                }, { threshold: 0.1 });
                reveals.forEach(el => observer.observe(el));
            }, 100);
        }

        async function loadPostDetail() {
            const postId = new URLSearchParams(window.location.search).get('id');
            if (!postId) { document.getElementById('loadingIndicator').classList.add('hidden'); document.getElementById('errorState').classList.remove('hidden'); return; }

            try {
                const { data: post, error } = await supabaseClient.from('posts').select('*').eq('id', postId).eq('status', 'published').single();
                document.getElementById('loadingIndicator').classList.add('hidden');
                if (error || !post) { document.getElementById('errorState').classList.remove('hidden'); return; }

                document.getElementById('postTitle').innerText = post.title;
                document.getElementById('postDate').innerText = new Date(post.created_at).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
                
                document.getElementById('usageRender').innerHTML = post.content_usage || '<p class="text-center text-outline">등록된 안내가 없습니다.</p>';

                const targetRender = document.getElementById('growthDynamicRender');
                try {
                    const growthData = JSON.parse(post.content_growth);
                    const steps = growthData.steps || [];

                    targetRender.className = "flex flex-col gap-16 md:gap-24 relative";
                    const timelineLine = '<div class="hidden md:block absolute left-1/2 top-0 bottom-0 w-[1px] bg-outline-variant/30 transform -translate-x-1/2 z-0"></div>';
                    
                    const timelineContent = steps.map((step, index) => {
                        const isEven = index % 2 === 0;
                        if (isEven) {
                            return `
                                <div class="reveal flex flex-col md:flex-row items-center gap-8 md:gap-16 relative z-10">
                                    <div class="w-full md:w-1/2 md:text-right">
                                        <span class="inline-block px-3 py-1 bg-secondary-container/50 text-on-secondary-container rounded-full font-label-sm text-label-sm mb-3">STEP 0${index + 1}</span>
                                        <h3 class="korean-serif text-2xl md:text-3xl text-primary mb-2">${step.title || ''}</h3>
                                        <p class="font-body-md text-body-md text-on-surface-variant">${(step.desc || '').replace(/\n/g, '<br>')}</p>
                                    </div>
                                    <div class="w-full md:w-1/2">
                                        <div class="aspect-[4/3] rounded-xl overflow-hidden ambient-shadow">
                                            <img alt="${step.title || ''}" class="w-full h-full object-cover" src="${step.img || './assets/icon1.png'}"/>
                                        </div>
                                    </div>
                                </div>
                            `;
                        } else {
                            return `
                                <div class="reveal flex flex-col md:flex-row-reverse items-center gap-8 md:gap-16 relative z-10">
                                    <div class="w-full md:w-1/2 md:text-left">
                                        <span class="inline-block px-3 py-1 bg-secondary-container/50 text-on-secondary-container rounded-full font-label-sm text-label-sm mb-3">STEP 0${index + 1}</span>
                                        <h3 class="korean-serif text-2xl md:text-3xl text-primary mb-2">${step.title || ''}</h3>
                                        <p class="font-body-md text-body-md text-on-surface-variant">${(step.desc || '').replace(/\n/g, '<br>')}</p>
                                    </div>
                                    <div class="w-full md:w-1/2">
                                        <div class="aspect-[3/4] md:aspect-[4/3] rounded-xl overflow-hidden ambient-shadow">
                                            <img alt="${step.title || ''}" class="w-full h-full object-cover" src="${step.img || './assets/icon1.png'}"/>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }
                    }).join('');
                    targetRender.innerHTML = timelineLine + timelineContent;
                    
                } catch (e) { targetRender.innerHTML = `<div class="post-body bg-surface p-8 rounded-xl">${post.content_growth}</div>`; }

                document.title = `하늘향 - ${post.title}`;
                document.getElementById('postArticle').classList.remove('hidden');
                initScrollReveal();

            } catch (error) { document.getElementById('errorState').classList.remove('hidden'); }
        }
        document.addEventListener('DOMContentLoaded', loadPostDetail);
    </script>
</body>
</html>
