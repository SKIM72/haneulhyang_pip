<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>하늘향 - 관리자 대시보드</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script id="tailwind-config">
        tailwind.config = {
            theme: { extend: { colors: { "primary": "#17341c", "background": "#fcf9f8", "surface": "#ffffff", "on-background": "#1c1b1b", "outline": "#737971", "outline-variant": "#c2c8bf" }, fontFamily: { "headline": ["EB Garamond"], "body": ["Hanken Grotesk"] } } }
        }
    </script>
    <style> 
        body { font-family: 'Hanken Grotesk', sans-serif; } 
        .ambient-shadow { box-shadow: 0 12px 32px rgba(27, 61, 47, 0.05); } 
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; } 
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">

    <header class="bg-surface border-b border-outline-variant/30 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="../assets/icon1.png" alt="하늘향 로고" class="w-10 h-10 object-contain">
                <span class="font-bold text-primary tracking-wider text-lg hidden sm:block">하늘향 관리자</span>
            </div>
            
            <div class="flex items-center gap-4">
                <span id="currentUserEmail" class="text-sm font-semibold text-primary bg-primary/10 px-3 py-1.5 rounded-full hidden md:block">로딩 중...</span>
                
                <button id="btnManageAccounts" onclick="openAccountModal()" class="hidden text-sm font-medium text-primary hover:bg-primary/5 transition-colors items-center gap-1 border border-primary/20 px-3 py-1.5 rounded-lg">
                    <span class="material-symbols-outlined text-base">manage_accounts</span> <span class="hidden sm:inline">계정 관리</span>
                </button>
                
                <a href="../index.html" class="text-sm font-medium text-outline hover:text-primary transition-colors flex items-center gap-1 px-2 py-1.5">
                    <span class="material-symbols-outlined text-base">home</span> <span class="hidden sm:inline">홈페이지</span>
                </a>
                
                <button id="btnLogout" class="text-sm font-medium text-outline hover:text-red-600 transition-colors flex items-center gap-1 px-2 py-1.5">
                    <span class="material-symbols-outlined text-base">logout</span> <span class="hidden sm:inline">로그아웃</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-5xl mx-auto w-full px-4 py-8">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-primary mb-1">제품 소개글 관리</h1>
                <p class="text-sm text-outline">홈페이지에 노출될 소개글을 관리하고 새 글을 작성할 수 있습니다.</p>
            </div>
            <button onclick="location.href='editor.html'" class="bg-primary text-white px-6 py-3 rounded-xl font-medium tracking-wide hover:opacity-90 active:scale-95 transition-all flex items-center gap-2 ambient-shadow">
                <span class="material-symbols-outlined">edit_square</span> 새 소개글 작성
            </button>
        </div>

        <div class="bg-surface p-4 md:p-5 rounded-2xl border border-outline-variant/30 mb-8 flex flex-col md:flex-row gap-4 ambient-shadow">
            <div class="flex-1">
                <label class="block text-xs font-bold text-primary mb-1.5 ml-1">포스트 검색</label>
                <input type="text" id="searchTitle" placeholder="이름으로 검색..." class="w-full px-4 py-2.5 text-sm bg-background border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all">
            </div>
            <div class="w-full md:w-48">
                <label class="block text-xs font-bold text-primary mb-1.5 ml-1">작성일자</label>
                <input type="date" id="searchDate" class="w-full px-4 py-2.5 text-sm bg-background border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all text-outline">
            </div>
            <div class="w-full md:w-40">
                <label class="block text-xs font-bold text-primary mb-1.5 ml-1">정렬 순서</label>
                <select id="sortOrder" class="w-full px-4 py-2.5 text-sm bg-background border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                    <option value="desc">최신순</option>
                    <option value="asc">과거순</option>
                </select>
            </div>
            <div class="w-full md:w-auto flex items-end">
                <button onclick="loadPosts()" class="w-full md:w-auto bg-primary text-white px-6 py-2.5 rounded-xl text-sm font-bold tracking-wide hover:opacity-90 active:scale-95 transition-all h-[42px] flex items-center justify-center gap-1">
                    <span class="material-symbols-outlined text-base">search</span> 검색
                </button>
            </div>
        </div>

        <div class="bg-surface rounded-2xl border border-outline-variant/30 ambient-shadow overflow-hidden">
            <div id="loadingIndicator" class="p-8 text-center text-outline">데이터를 불러오는 중입니다...</div>
            <ul id="postsList" class="divide-y divide-outline-variant/30 hidden"></ul>
            <div id="emptyState" class="hidden p-12 text-center flex flex-col items-center">
                <span class="material-symbols-outlined text-6xl text-outline-variant mb-4">search_off</span>
                <h3 class="text-lg font-medium text-primary mb-2">조건에 맞는 소개글이 없습니다</h3>
                <p class="text-sm text-outline">조건을 변경하거나 새로운 글을 작성해 보세요.</p>
            </div>
        </div>
    </main>

    <div id="accountModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-surface w-full max-w-2xl rounded-2xl shadow-2xl border border-outline-variant/30 flex flex-col max-h-[80vh]">
            <div class="p-5 border-b border-outline-variant/30 flex justify-between items-center bg-background rounded-t-2xl">
                <h2 class="text-lg font-bold text-primary flex items-center gap-2"><span class="material-symbols-outlined">group</span> 회원 가입 승인 관리</h2>
                <button onclick="closeAccountModal()" class="text-outline hover:text-on-background transition-colors"><span class="material-symbols-outlined">close</span></button>
            </div>
            <div class="p-0 overflow-y-auto flex-1">
                <ul id="accountList" class="divide-y divide-outline-variant/30">
                    <li class="p-8 text-center text-outline">계정 데이터를 불러오는 중입니다...</li>
                </ul>
            </div>
        </div>
    </div>

    <div id="qrModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-surface w-full max-w-sm rounded-2xl shadow-2xl border border-outline-variant/30 flex flex-col">
            <div class="p-5 border-b border-outline-variant/30 flex justify-between items-center bg-background rounded-t-2xl">
                <h2 class="text-lg font-bold text-primary flex items-center gap-2"><span class="material-symbols-outlined">qr_code_2</span> 제품 QR 코드</h2>
                <button onclick="closeQrModal()" class="text-outline hover:text-on-background transition-colors"><span class="material-symbols-outlined">close</span></button>
            </div>
            <div class="p-8 flex flex-col items-center justify-center bg-white rounded-b-2xl">
                <div id="qrCodeContainer" class="mb-5 border border-outline-variant/20 rounded-xl p-2 shadow-sm bg-white min-h-[220px] min-w-[220px] flex items-center justify-center"></div>
                <p id="qrPostTitle" class="text-sm font-bold text-primary mb-1 text-center w-full truncate px-4"></p>
                <p class="text-xs text-outline mb-6 text-center">이 QR 코드를 스캔하면 해당 제품의<br>상세 소개 페이지로 즉시 이동합니다.</p>
                <button id="btnDownloadQr" class="w-full bg-primary text-white py-3 rounded-xl font-medium text-sm tracking-wider hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2 ambient-shadow">
                    <span class="material-symbols-outlined text-base">download</span> 이미지 다운로드 (PNG)
                </button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://eyoahkbqfxcisvmkvikp.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5b2Foa2JxZnhjaXN2bWt2aWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NDAzODUsImV4cCI6MjA5NTAxNjM4NX0.-JgH5ACzfq-d96VXEZlXovXx0w_uR3gJiwonaushah8";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const SUPER_ADMIN_EMAIL = 'eowert72@gmail.com';

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            
            const userEmail = session.user.email;
            document.getElementById('currentUserEmail').innerText = userEmail;

            if (userEmail === SUPER_ADMIN_EMAIL) {
                document.getElementById('btnManageAccounts').classList.remove('hidden');
                document.getElementById('btnManageAccounts').classList.add('flex');
            }
            
            return session;
        }

        async function openAccountModal() {
            document.getElementById('accountModal').classList.remove('hidden');
            await loadAccounts();
        }

        function closeAccountModal() {
            document.getElementById('accountModal').classList.add('hidden');
        }

        async function loadAccounts() {
            const listEl = document.getElementById('accountList');
            const { data: profiles, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                listEl.innerHTML = `<li class="p-8 text-center text-red-600">불러오기 실패: ${error.message}</li>`;
                return;
            }

            listEl.innerHTML = '';
            profiles.forEach(profile => {
                const isSuperAdmin = profile.email === SUPER_ADMIN_EMAIL;
                const statusBadge = profile.is_approved 
                    ? `<span class="px-2 py-1 bg-green-100 text-green-800 text-xs font-bold rounded">승인됨</span>`
                    : `<span class="px-2 py-1 bg-red-100 text-red-800 text-xs font-bold rounded">대기중/차단</span>`;
                
                const toggleBtn = isSuperAdmin 
                    ? `<span class="text-xs text-outline font-medium">최고 권한</span>`
                    : `<button onclick="toggleApproval('${profile.id}', ${!profile.is_approved})" class="px-3 py-1.5 text-xs font-bold border rounded-lg transition-colors ${profile.is_approved ? 'border-red-200 text-red-600 bg-red-50 hover:bg-red-100' : 'border-primary/20 text-primary bg-primary/5 hover:bg-primary/10'}">
                        ${profile.is_approved ? '접근 차단하기' : '가입 승인하기'}
                       </button>`;

                listEl.innerHTML += `
                    <li class="p-4 hover:bg-gray-50 flex items-center justify-between gap-4">
                        <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                            <span class="font-medium text-sm text-on-background">${profile.email}</span>
                            ${statusBadge}
                        </div>
                        <div>${toggleBtn}</div>
                    </li>
                `;
            });
        }

        window.toggleApproval = async function(userId, newStatus) {
            const { error } = await supabaseClient
                .from('profiles')
                .update({ is_approved: newStatus })
                .eq('id', userId);

            if (error) {
                alert('상태 변경 실패: ' + error.message);
            } else {
                await loadAccounts(); 
            }
        };

        async function loadPosts() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            const postsList = document.getElementById('postsList');
            const emptyState = document.getElementById('emptyState');

            const searchTitle = document.getElementById('searchTitle').value.trim();
            const searchDate = document.getElementById('searchDate').value;
            const sortOrder = document.getElementById('sortOrder').value;

            loadingIndicator.classList.remove('hidden');
            postsList.classList.add('hidden');
            emptyState.classList.add('hidden');

            let query = supabaseClient.from('posts').select('*');
            
            if (sortOrder === 'asc') query = query.order('created_at', { ascending: true });
            else query = query.order('created_at', { ascending: false });

            if (searchTitle) query = query.ilike('title', `%${searchTitle}%`);

            const { data: posts, error } = await query;
            loadingIndicator.classList.add('hidden');

            let filteredPosts = posts || [];

            if (searchDate) {
                filteredPosts = filteredPosts.filter(post => {
                    const dateObj = new Date(post.created_at);
                    const year = dateObj.getFullYear();
                    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                    const day = String(dateObj.getDate()).padStart(2, '0');
                    const formattedLocal = `${year}-${month}-${day}`;
                    return formattedLocal === searchDate;
                });
            }

            if (!filteredPosts || filteredPosts.length === 0) {
                emptyState.classList.remove('hidden'); 
                return;
            }
            
            postsList.classList.remove('hidden'); 
            postsList.innerHTML = '';

            filteredPosts.forEach(post => {
                const statusBadge = post.status === 'published' 
                    ? `<span class="px-2.5 py-1 bg-green-100 text-green-800 text-xs font-bold rounded-md">발행됨</span>`
                    : `<span class="px-2.5 py-1 bg-gray-100 text-gray-700 text-xs font-bold rounded-md">임시저장</span>`;
                
                const date = new Date(post.created_at).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
                
                // 💡 수정: HTML 속성 충돌을 완벽 방지하기 위해 큰따옴표만 안전하게 이스케이프 처리
                const escapedTitle = (post.title || '제목 없음').replace(/"/g, '&quot;');

                const li = document.createElement('li');
                li.className = "p-5 sm:p-6 hover:bg-gray-50 transition-colors flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between";
                li.innerHTML = `
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-1">${statusBadge}<span class="text-xs text-outline">${date}</span></div>
                        <h2 class="text-lg font-semibold text-primary truncate max-w-xl">${post.title || '제목 없음'}</h2>
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <button onclick="openQrModal('${post.id}', this)" data-title="${escapedTitle}" class="flex-1 sm:flex-none px-4 py-2 text-sm font-medium border border-primary/20 text-primary bg-primary/5 rounded-lg hover:bg-primary/10 transition-colors">QR 생성</button>
                        <button onclick="editPost('${post.id}')" class="flex-1 sm:flex-none px-4 py-2 text-sm font-medium border border-outline-variant text-primary rounded-lg hover:bg-white transition-colors">수정</button>
                        <button onclick="deletePost('${post.id}')" class="flex-1 sm:flex-none px-4 py-2 text-sm font-medium border border-red-200 text-red-600 bg-red-50 rounded-lg hover:bg-red-100 transition-colors">삭제</button>
                    </div>
                `;
                postsList.appendChild(li);
            });
        }

        // 💡 수정: 안정적인 QR 로직 및 파일명 오류 방지 로직 적용
        window.openQrModal = function(postId, btnElement) {
            // 버튼 요소에 저장해둔 안전한 제목 데이터를 꺼내옵니다.
            const postTitle = btnElement.getAttribute('data-title');
            
            document.getElementById('qrModal').classList.remove('hidden');
            document.getElementById('qrPostTitle').innerText = postTitle;

            const postUrl = new URL(`../detail.html?id=${postId}`, window.location.href).href;
            const container = document.getElementById('qrCodeContainer');
            
            // 기존 QR 삭제
            container.innerHTML = '';
            
            // 새로운 QR 생성
            new QRCode(container, {
                text: postUrl,
                width: 220,
                height: 220,
                colorDark : "#17341c",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // 다운로드 로직
            document.getElementById('btnDownloadQr').onclick = function() {
                const canvas = container.querySelector('canvas');
                if (canvas) {
                    const imgData = canvas.toDataURL("image/png");
                    const link = document.createElement('a');
                    
                    // 💡 수정: 컴퓨터 파일명으로 금지된 특수문자 제거(언더스코어 처리)하여 OS 저장 거부 완벽 차단
                    const safeTitle = postTitle.replace(/[^a-zA-Z0-9가-힣]/g, '_').substring(0, 15);
                    
                    link.download = `하늘향_QR_${safeTitle}.png`;
                    link.href = imgData;
                    link.click();
                }
            };
        };

        window.closeQrModal = function() {
            document.getElementById('qrModal').classList.add('hidden');
        };

        document.getElementById('btnLogout').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        });

        window.editPost = function(id) { window.location.href = `editor.html?id=${id}`; };

        window.deletePost = async function(id) {
            if (confirm('정말 이 소개글을 삭제하시겠습니까?\n삭제된 글은 복구할 수 없습니다.')) {
                await supabaseClient.from('posts').delete().eq('id', id);
                loadPosts(); 
            }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            loadPosts();
        });
    </script>
</body>
</html>
