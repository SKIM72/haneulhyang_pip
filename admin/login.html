<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>하늘향 - 관리자 로그인</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="../assets/favicon-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"/>
    <link rel="stylesheet" href="../assets/tailwind.css">
    <style> .hidden-view { display: none; } </style>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#17341c">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-surface-container-lowest p-8 rounded-2xl ambient-shadow border border-outline-variant/30">
        <div class="text-center mb-8">
            <img src="../assets/icon1.png" alt="하늘향 로고" class="w-28 h-auto mx-auto mb-4 object-contain">
            <h1 class="headline-font text-3xl font-semibold text-primary tracking-wider mb-2">하늘향</h1>
            <p class="text-sm text-outline font-medium">하늘향 제품 소개 페이지 관리자 로그인</p>
        </div>
        <div id="alertMessage" class="text-xs font-medium hidden p-3 rounded-lg border mb-5 text-center"></div>

        <div id="view-login">
            <form id="form-login" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-primary uppercase tracking-wider mb-1.5">이메일 주소</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-3 bg-background border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-sm transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-primary uppercase tracking-wider mb-1.5">비밀번호</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-3 bg-background border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-sm transition-all">
                </div>
                <button type="submit" id="btn-login" class="w-full bg-primary text-white py-3 rounded-xl font-medium text-sm tracking-wider hover:opacity-90 active:scale-[0.98] transition-all">로그인</button>
            </form>
            <div class="mt-6 flex justify-between text-sm text-outline font-medium">
                <button type="button" onclick="switchView('view-signup')" class="hover:text-primary transition-colors">회원가입</button>
                <button type="button" onclick="switchView('view-reset')" class="hover:text-primary transition-colors">비밀번호 찾기</button>
            </div>
        </div>

        <div id="view-signup" class="hidden-view">
            <form id="form-signup" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-primary uppercase tracking-wider mb-1.5">이메일 주소</label>
                    <input type="email" id="signup-email" required class="w-full px-4 py-3 bg-background border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-sm transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-primary uppercase tracking-wider mb-1.5">비밀번호</label>
                    <input type="password" id="signup-password" required class="w-full px-4 py-3 bg-background border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-sm transition-all" placeholder="6자리 이상">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-primary uppercase tracking-wider mb-1.5">비밀번호 확인</label>
                    <input type="password" id="signup-password-confirm" required class="w-full px-4 py-3 bg-background border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-sm transition-all" placeholder="비밀번호 재입력">
                </div>
                <button type="submit" id="btn-signup" class="w-full bg-primary text-white py-3 rounded-xl font-medium text-sm tracking-wider hover:opacity-90 active:scale-[0.98] transition-all">가입하기</button>
            </form>
            <div class="mt-6 text-center text-sm text-outline font-medium">
                이미 계정이 있으신가요? <button type="button" onclick="switchView('view-login')" class="text-primary hover:underline ml-1">로그인</button>
            </div>
        </div>

        <div id="view-reset" class="hidden-view">
            <p class="text-sm text-on-surface-variant mb-5 text-center">가입하신 이메일을 입력하시면 비밀번호 초기화 링크를 보내드립니다.</p>
            <form id="form-reset" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-primary uppercase tracking-wider mb-1.5">이메일 주소</label>
                    <input type="email" id="reset-email" required class="w-full px-4 py-3 bg-background border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-sm transition-all">
                </div>
                <button type="submit" id="btn-reset" class="w-full bg-primary text-white py-3 rounded-xl font-medium text-sm tracking-wider hover:opacity-90 active:scale-[0.98] transition-all">초기화 메일 보내기</button>
            </form>
            <div class="mt-6 text-center text-sm text-outline font-medium">
                <button type="button" onclick="switchView('view-login')" class="text-primary hover:underline">로그인으로 돌아가기</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/app.js"></script>
    <script>
        const supabaseClient = HY.supa();

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.location.href = 'dashboard.html';
        });

        function switchView(viewId) {
            document.getElementById('view-login').style.display = 'none';
            document.getElementById('view-signup').style.display = 'none';
            document.getElementById('view-reset').style.display = 'none';
            document.getElementById('alertMessage').classList.add('hidden');
            document.getElementById(viewId).style.display = 'block';
        }

        function showAlert(msg, isError = true) {
            const alertEl = document.getElementById('alertMessage');
            alertEl.innerText = msg;
            alertEl.className = `text-xs font-medium p-3 rounded-lg border mb-5 text-center ${isError ? 'bg-red-50 text-red-600 border-red-200' : 'bg-green-50 text-green-700 border-green-200'}`;
            alertEl.classList.remove('hidden');
        }

        // 로그인 프로세스
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.disabled = true; btn.innerText = "로그인 중...";
            
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-password').value,
            });

            if (error) {
                showAlert(error.message === "Invalid login credentials" ? "이메일 또는 비밀번호가 일치하지 않습니다." : error.message);
                btn.disabled = false; btn.innerText = "로그인";
                return;
            }

            // 💡 [추가된 핵심 로직] 최고 권한자의 승인 여부 검사
            if (data.session) {
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('is_approved')
                    .eq('id', data.session.user.id)
                    .single();

                if (profile && profile.is_approved === false) {
                    await supabaseClient.auth.signOut(); // 미승인 시 즉시 강제 로그아웃
                    showAlert("관리자의 가입 승인을 대기 중입니다.");
                    btn.disabled = false; btn.innerText = "로그인";
                    return;
                }
                
                window.location.href = 'dashboard.html';
            }
        });

        document.getElementById('form-signup').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('signup-password').value;
            const passwordConfirm = document.getElementById('signup-password-confirm').value;

            if (password !== passwordConfirm) {
                showAlert("비밀번호가 서로 일치하지 않습니다.");
                return;
            }

            const btn = document.getElementById('btn-signup');
            btn.disabled = true; btn.innerText = "처리 중...";

            const { error } = await supabaseClient.auth.signUp({
                email: document.getElementById('signup-email').value,
                password: password,
            });

            if (error) {
                showAlert(error.message);
                btn.disabled = false; btn.innerText = "가입하기";
            } else {
                showAlert("가입이 완료되었습니다. 관리자 승인 후 로그인 가능합니다.", false);
                btn.disabled = false; btn.innerText = "가입하기";
                document.getElementById('form-signup').reset();
            }
        });

        document.getElementById('form-reset').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-reset');
            btn.disabled = true; btn.innerText = "처리 중...";

            const { error } = await supabaseClient.auth.resetPasswordForEmail(
                document.getElementById('reset-email').value,
                { redirectTo: window.location.origin + '/admin/dashboard.html' }
            );

            if (error) {
                showAlert(error.message);
            } else {
                showAlert("비밀번호 초기화 링크가 이메일로 전송되었습니다.", false);
                document.getElementById('form-reset').reset();
            }
            btn.disabled = false; btn.innerText = "초기화 메일 보내기";
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../sw.js')
                    .then(registration => console.log('ServiceWorker registration successful'))
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }
    </script>
</body>
</html>
