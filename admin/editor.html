<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>하늘향 - 세트 글쓰기 빌더</title>
    
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script id="tailwind-config">
        tailwind.config = { theme: { extend: { colors: { "primary": "#17341c", "background": "#fcf9f8", "surface": "#ffffff", "outline": "#737971", "outline-variant": "#c2c8bf" } } } }
    </script>
    <style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
        .ambient-shadow { box-shadow: 0 12px 32px rgba(27, 61, 47, 0.05); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .ql-container.ql-snow { border: 1px solid #c2c8bf !important; border-top: none !important; border-radius: 0 0 12px 12px; font-size: 16px; min-height: 280px; }
        .ql-toolbar.ql-snow { border: 1px solid #c2c8bf !important; border-radius: 12px 12px 0 0; background-color: #fcf9f8; padding: 10px; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col pb-24">

    <header class="bg-surface border-b border-outline-variant/30 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button onclick="history.back()" class="text-outline hover:text-primary transition-colors flex items-center"><span class="material-symbols-outlined text-2xl">arrow_back</span></button>
                <span class="font-bold text-primary tracking-wider text-lg">하늘향 포스트 빌더</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="savePost('draft')" id="btnDraft" class="px-4 py-2 text-sm font-medium border border-outline-variant text-primary rounded-xl hover:bg-gray-50 transition-colors">임시저장</button>
                <button onclick="savePost('published')" id="btnPublish" class="bg-primary text-white px-5 py-2 rounded-xl text-sm font-medium tracking-wide hover:opacity-90 active:scale-95 transition-all ambient-shadow">발행하기</button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-8 space-y-8">
        
        <div class="bg-surface rounded-2xl border border-outline-variant/30 ambient-shadow p-6 sm:p-10">
            <label class="block text-xs font-bold text-primary uppercase tracking-wider mb-2">포스트 대제목</label>
            <input type="text" id="postTitle" placeholder="예시: 무농약으로 직접 키워 구수한 작두콩차" class="w-full text-xl font-bold text-primary placeholder-outline-variant border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary px-4 py-3 bg-transparent">
        </div>

        <div class="bg-surface rounded-2xl border border-outline-variant/30 ambient-shadow p-6 sm:p-10">
            <div class="flex items-center justify-between mb-6">
                <label class="flex items-center gap-1 text-xs font-bold text-primary uppercase tracking-wider">
                    <span class="material-symbols-outlined text-base text-green-600">potted_plant</span> 🌱 1단계: 성장 과정 스텝 빌더
                </label>
                
                <div class="flex items-center gap-4 bg-background p-2 rounded-lg border border-outline-variant/30">
                    <span class="text-xs font-bold text-outline">레이아웃 선택:</span>
                    
                    <label class="group relative cursor-pointer flex items-center gap-1.5">
                        <input type="radio" name="layoutType" value="bento" checked class="text-primary focus:ring-primary">
                        <span class="text-sm font-medium text-primary">벤토 그리드</span>
                        <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block w-32 bg-white border shadow-xl rounded-lg p-2 z-10">
                            <div class="grid grid-cols-2 gap-1 h-20">
                                <div class="col-span-2 bg-gray-200 rounded"></div>
                                <div class="bg-gray-200 rounded"></div>
                                <div class="bg-gray-200 rounded"></div>
                            </div>
                            <p class="text-[10px] text-center mt-1 text-gray-500">PC 비대칭, 모바일 세로형</p>
                        </div>
                    </label>

                    <label class="group relative cursor-pointer flex items-center gap-1.5">
                        <input type="radio" name="layoutType" value="zigzag" class="text-primary focus:ring-primary">
                        <span class="text-sm font-medium text-primary">지그재그형</span>
                        <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block w-32 bg-white border shadow-xl rounded-lg p-2 z-10">
                            <div class="flex flex-col gap-1 h-20">
                                <div class="flex gap-1 h-1/2"><div class="w-1/2 bg-gray-100 rounded"></div><div class="w-1/2 bg-gray-200 rounded"></div></div>
                                <div class="flex gap-1 h-1/2"><div class="w-1/2 bg-gray-200 rounded"></div><div class="w-1/2 bg-gray-100 rounded"></div></div>
                            </div>
                            <p class="text-[10px] text-center mt-1 text-gray-500">좌우 교차형 뷰</p>
                        </div>
                    </label>
                </div>
            </div>

            <div id="stepsContainer" class="space-y-6 mb-6"></div>

            <button onclick="addStep()" class="w-full py-4 border-2 border-dashed border-primary/30 text-primary font-bold rounded-xl hover:bg-primary/5 transition-colors flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">add_circle</span> 새로운 스텝 추가하기
            </button>
        </div>

        <div class="bg-surface rounded-2xl border border-outline-variant/30 ambient-shadow p-6 sm:p-10">
            <label class="flex items-center gap-1 text-xs font-bold text-primary uppercase tracking-wider mb-2">
                <span class="material-symbols-outlined text-base text-amber-700">local_cafe</span> ☕ 2단계: 제품 특징 및 활용법
            </label>
            <div id="editorUsage"></div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = "https://eyoahkbqfxcisvmkvikp.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5b2Foa2JxZnhjaXN2bWt2aWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NDAzODUsImV4cCI6MjA5NTAxNjM4NX0.-JgH5ACzfq-d96VXEZlXovXx0w_uR3gJiwonaushah8";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let postId = null;
        let growthSteps = []; // 스텝 데이터를 담을 배열

        // 활용법 에디터 초기화
        const quillUsage = new Quill('#editorUsage', { 
            theme: 'snow', 
            placeholder: '제품을 다양하게 활용하는 방법을 자유롭게 적어주세요.',
            modules: { toolbar: { container: [[{ 'header': [1, 2, false] }], ['bold', 'underline'], [{ 'list': 'ordered'}, { 'list': 'bullet' }], ['image'], ['clean']], handlers: { image: () => imgHandler(quillUsage) } } } 
        });

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) window.location.href = 'login.html';
        }

        // --- 스텝 빌더 로직 ---
        function renderSteps() {
            const container = document.getElementById('stepsContainer');
            container.innerHTML = '';
            
            growthSteps.forEach((step, index) => {
                const stepHTML = `
                    <div class="p-5 border border-outline-variant/50 rounded-xl bg-background relative flex flex-col md:flex-row gap-4 group">
                        <button onclick="removeStep(${index})" class="absolute top-2 right-2 text-red-400 hover:text-red-600 hidden group-hover:block"><span class="material-symbols-outlined">delete</span></button>
                        
                        <div class="w-full md:w-1/3 flex flex-col gap-2">
                            <div class="aspect-video bg-gray-100 rounded-lg border border-dashed border-gray-300 flex items-center justify-center overflow-hidden relative">
                                ${step.img ? `<img src="${step.img}" class="w-full h-full object-cover">` : `<span class="text-sm text-gray-400">이미지 없음</span>`}
                            </div>
                            <button onclick="uploadStepImage(${index})" class="text-xs bg-primary/10 text-primary py-1.5 rounded font-bold hover:bg-primary/20">사진 업로드</button>
                        </div>
                        
                        <div class="w-full md:w-2/3 flex flex-col gap-3">
                            <span class="text-xs font-bold text-outline">STEP ${String(index + 1).padStart(2, '0')}</span>
                            <input type="text" value="${step.title}" onchange="updateStep(${index}, 'title', this.value)" placeholder="스텝 소제목 (예: 튼실한 씨앗의 시작)" class="w-full border-b border-outline-variant/30 focus:border-primary bg-transparent py-1 text-primary font-bold">
                            <textarea onchange="updateStep(${index}, 'desc', this.value)" placeholder="설명을 입력하세요..." class="w-full flex-1 border border-outline-variant/30 rounded-lg p-2 text-sm resize-none focus:ring-1 focus:ring-primary">${step.desc}</textarea>
                        </div>
                    </div>
                `;
                container.innerHTML += stepHTML;
            });
        }

        window.addStep = function() {
            growthSteps.push({ img: '', title: '', desc: '' });
            renderSteps();
        }

        window.removeStep = function(index) {
            growthSteps.splice(index, 1);
            renderSteps();
        }

        window.updateStep = function(index, field, value) {
            growthSteps[index][field] = value;
        }

        // 스텝 개별 이미지 업로드 로직
        window.uploadStepImage = function(index) {
            const input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'image/*');
            input.click();

            input.onchange = async () => {
                const file = input.files[0];
                if (!file) return;

                const fileExt = file.name.split('.').pop();
                const fileName = `${Math.random().toString(36).substring(2, 15)}.${fileExt}`;
                const filePath = `post_images/${fileName}`;

                try {
                    const { error } = await supabaseClient.storage.from('images').upload(filePath, file);
                    if (error) throw error;
                    const { data } = supabaseClient.storage.from('images').getPublicUrl(filePath);
                    
                    growthSteps[index].img = data.publicUrl;
                    renderSteps(); // 이미지 업로드 후 화면 갱신
                } catch (error) {
                    alert('사진 업로드 실패: ' + error.message);
                }
            };
        }

        // 활용법 에디터용 이미지 핸들러
        function imgHandler(quillInstance) {
            const input = document.createElement('input'); input.setAttribute('type', 'file'); input.setAttribute('accept', 'image/*'); input.click();
            input.onchange = async () => {
                const file = input.files[0]; if (!file) return;
                const range = quillInstance.getSelection(true); quillInstance.insertText(range.index, '업로드 중...', 'color', '#737971');
                const filePath = `post_images/${Math.random().toString(36).substring(2, 15)}.${file.name.split('.').pop()}`;
                try {
                    await supabaseClient.storage.from('images').upload(filePath, file);
                    const { data } = supabaseClient.storage.from('images').getPublicUrl(filePath);
                    quillInstance.deleteText(range.index, 6); quillInstance.insertEmbed(range.index, 'image', data.publicUrl);
                } catch (error) { alert('업로드 실패'); }
            };
        }

        // 기존 데이터 불러오기
        async function loadPostData() {
            const urlParams = new URLSearchParams(window.location.search);
            postId = urlParams.get('id');

            if (postId) {
                const { data: post } = await supabaseClient.from('posts').select('*').eq('id', postId).single();
                if (post) {
                    document.getElementById('postTitle').value = post.title;
                    quillUsage.root.innerHTML = post.content_usage || '';
                    
                    // JSON 형태로 저장된 성장 데이터 파싱 시도
                    try {
                        const growthData = JSON.parse(post.content_growth);
                        if (growthData.layout) {
                            document.querySelector(`input[name="layoutType"][value="${growthData.layout}"]`).checked = true;
                        }
                        if (growthData.steps && Array.isArray(growthData.steps)) {
                            growthSteps = growthData.steps;
                        }
                    } catch (e) {
                        // 과거 호환성: 과거에 HTML로 적었던 글이 있다면 스텝 1개로 임의 변환
                        if(post.content_growth) {
                            growthSteps = [{ img: '', title: '과거 기록', desc: post.content_growth.replace(/<[^>]*>?/gm, '') }];
                        }
                    }
                }
            }
            // 스텝이 0개면 기본 1개 세팅
            if(growthSteps.length === 0) addStep();
            else renderSteps();
        }

        // 글 저장 로직
        window.savePost = async function(status) {
            const title = document.getElementById('postTitle').value.trim();
            const usageHtml = quillUsage.root.innerHTML;
            const selectedLayout = document.querySelector('input[name="layoutType"]:checked').value;

            if (!title) return alert('대제목을 입력해 주세요.');

            // 💡 [핵심] 1단계 성장 과정 데이터를 JSON 문자열로 묶어서 하나의 텍스트로 저장
            const growthPayload = JSON.stringify({
                layout: selectedLayout,
                steps: growthSteps
            });

            // 썸네일은 첫 번째 스텝의 이미지로 자동 지정
            let thumbnailUrl = null;
            if (growthSteps.length > 0 && growthSteps[0].img) thumbnailUrl = growthSteps[0].img;

            const postData = {
                title: title,
                content_growth: growthPayload, // JSON 텍스트로 저장됨
                content_usage: usageHtml,
                status: status,
                thumbnail_url: thumbnailUrl
            };

            const btnPublish = document.getElementById('btnPublish'); btnPublish.disabled = true;

            try {
                if (postId) await supabaseClient.from('posts').update(postData).eq('id', postId);
                else await supabaseClient.from('posts').insert([postData]);
                
                alert(status === 'published' ? '홈페이지에 정상 발행되었습니다.' : '임시저장 되었습니다.');
                window.location.href = 'dashboard.html';
            } catch (error) {
                alert('저장 실패: ' + error.message);
                btnPublish.disabled = false;
            }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            loadPostData();
        });
    </script>
</body>
</html>
