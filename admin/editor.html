<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>하늘향 - 세트 글쓰기 빌더</title>
    
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"/>
    <link rel="stylesheet" href="../assets/tailwind.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#17341c">
    <link rel="apple-touch-icon" href="../assets/icon1.png">
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col pb-24">

    <header class="bg-surface-container-lowest border-b border-outline-variant/30 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button onclick="history.back()" class="text-outline hover:text-primary transition-colors flex items-center"><span class="material-symbols-outlined text-2xl">arrow_back</span></button>
                <span class="font-bold text-primary tracking-wider text-lg">하늘향 포스트 빌더</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="savePost('draft')" id="btnDraft" class="px-4 py-2 text-sm font-medium border border-outline-variant text-primary rounded-xl hover:bg-gray-50 transition-colors">임시저장</button>
                <button onclick="savePost('published')" id="btnPublish" class="bg-primary text-white px-5 py-2 rounded-xl text-sm font-medium tracking-wide hover:opacity-90 active:scale-95 transition-all ambient-shadow">발행하기</button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-8 space-y-8">
        
        <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant/30 ambient-shadow p-6 sm:p-10">
            <label class="block text-xs font-bold text-primary uppercase tracking-wider mb-2">포스트 대제목</label>
            <input type="text" id="postTitle" placeholder="예시: 무농약으로 직접 키워 구수한 작두콩차" class="w-full text-xl font-bold text-primary placeholder-outline-variant border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary px-4 py-3 bg-transparent">
        </div>

        <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant/30 ambient-shadow p-6 sm:p-10">
            <div class="flex items-center justify-between mb-6">
                <label class="flex items-center gap-1 text-xs font-bold text-primary uppercase tracking-wider">
                    <span class="material-symbols-outlined text-base text-green-600">potted_plant</span> 🌱 1단계: 성장 과정 스텝 빌더
                </label>
                
                <div class="flex items-center gap-4 bg-background p-2 rounded-lg border border-outline-variant/30">
                    <span class="text-xs font-bold text-outline">레이아웃 선택:</span>
                    
                    <label class="group relative cursor-pointer flex items-center gap-1.5">
                        <input type="radio" name="layoutType" value="zigzag" checked class="text-primary focus:ring-primary">
                        <span class="text-sm font-medium text-primary">지그재그형</span>
                        <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block w-32 bg-white border shadow-xl rounded-lg p-2 z-10">
                            <div class="flex flex-col gap-1 h-20">
                                <div class="flex gap-1 h-1/2"><div class="w-1/2 bg-gray-100 rounded"></div><div class="w-1/2 bg-gray-200 rounded"></div></div>
                                <div class="flex gap-1 h-1/2"><div class="w-1/2 bg-gray-200 rounded"></div><div class="w-1/2 bg-gray-100 rounded"></div></div>
                            </div>
                            <p class="text-[10px] text-center mt-1 text-gray-500">좌우 교차형 뷰</p>
                        </div>
                    </label>

                    <label class="group relative cursor-pointer flex items-center gap-1.5">
                        <input type="radio" name="layoutType" value="bento" class="text-primary focus:ring-primary">
                        <span class="text-sm font-medium text-primary">벤토 그리드</span>
                        <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block w-32 bg-white border shadow-xl rounded-lg p-2 z-10">
                            <div class="grid grid-cols-2 gap-1 h-20">
                                <div class="col-span-2 bg-gray-200 rounded"></div>
                                <div class="bg-gray-200 rounded"></div>
                                <div class="bg-gray-200 rounded"></div>
                            </div>
                            <p class="text-[10px] text-center mt-1 text-gray-500">PC 비대칭, 모바일 세로형</p>
                        </div>
                    </label>
                </div>
            </div>

            <div id="stepsContainer" class="space-y-6 mb-6"></div>

            <button onclick="addStep()" class="w-full py-4 border-2 border-dashed border-primary/30 text-primary font-bold rounded-xl hover:bg-primary/5 transition-colors flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">add_circle</span> 성장 스텝 추가하기
            </button>
        </div>

        <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant/30 ambient-shadow p-6 sm:p-10">
            <div class="mb-6">
                <label class="flex items-center gap-1 text-xs font-bold text-primary uppercase tracking-wider mb-1">
                    <span class="material-symbols-outlined text-base text-amber-700">local_cafe</span> ☕ 2단계: 제품 특징 및 활용법 카드
                </label>
                <p class="text-xs text-outline">사진, 소제목, 간단한 설명을 입력하면 홈페이지에 깔끔한 갤러리 카드로 자동 배치됩니다.</p>
            </div>

            <div id="usageContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6"></div>

            <button onclick="addUsage()" class="w-full py-4 border-2 border-dashed border-amber-700/30 text-amber-800 font-bold rounded-xl hover:bg-amber-50 transition-colors flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">add_photo_alternate</span> 새로운 활용법 카드 추가
            </button>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/app.js"></script>
    <script>
        const supabaseClient = HY.supa();
        const SUPER_ADMIN_EMAIL = 'eowert72@gmail.com';
        const escAttr = HY.esc;
        const uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));

        let postId = null;
        let isDirty = false;   // 저장하지 않은 변경이 있는지
        let growthSteps = []; 
        let usageSteps = []; 

        // 드래그 앤 드롭을 위한 상태 변수
        let dragSrcStepIndex = null;
        let dragSrcImgIndex = null;

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return false;
            }
            if (session.user.email !== SUPER_ADMIN_EMAIL) {
                const { data: profile, error } = await supabaseClient
                    .from('profiles')
                    .select('is_approved')
                    .eq('id', session.user.id)
                    .single();
                if (error || !profile || profile.is_approved !== true) {
                    await supabaseClient.auth.signOut();
                    alert('관리자 승인이 완료되지 않은 계정입니다.');
                    window.location.href = 'login.html';
                    return false;
                }
            }
            return true;
        }

        function renderSteps() {
            const container = document.getElementById('stepsContainer');
            container.innerHTML = growthSteps.map((step, index) => {

                const images = step.images || (step.img ? [step.img] : []);
                
                const ratioHTML = `
                    <div class="flex items-center gap-3 mb-3 bg-surface-variant/30 p-2 rounded-lg border border-outline-variant/30">
                        <span class="text-[10px] font-bold text-outline uppercase tracking-wider">비율</span>
                        <label class="cursor-pointer flex items-center gap-1.5">
                            <input type="radio" name="aspect_${index}" value="landscape" ${step.aspect !== 'portrait' ? 'checked' : ''} onchange="updateData('growth', ${index}, 'aspect', this.value)" class="text-primary w-3.5 h-3.5">
                            <span class="text-xs font-medium text-primary">가로 (4:3)</span>
                        </label>
                        <label class="cursor-pointer flex items-center gap-1.5">
                            <input type="radio" name="aspect_${index}" value="portrait" ${step.aspect === 'portrait' ? 'checked' : ''} onchange="updateData('growth', ${index}, 'aspect', this.value)" class="text-primary w-3.5 h-3.5">
                            <span class="text-xs font-medium text-primary">세로 (3:4)</span>
                        </label>
                    </div>
                `;

                let imagesHTML = '';
                if (images.length > 0) {
                    imagesHTML = `<div class="grid grid-cols-2 gap-2 mb-2">`;
                    images.forEach((img, i) => {
                        imagesHTML += `
                            <div draggable="true" ondragstart="dragStart(event, ${index}, ${i})" ondragover="dragOver(event)" ondrop="drop(event, ${index}, ${i})" class="relative aspect-square rounded-lg border border-outline-variant/30 overflow-hidden group/img bg-surface-variant cursor-move">
                                <div class="absolute top-1.5 left-1.5 bg-black/60 text-white text-[10px] font-bold px-1.5 py-0.5 rounded z-10 pointer-events-none">${i + 1}</div>
                                <img src="${escAttr(img)}" alt="" class="w-full h-full object-cover pointer-events-none">
                                <button onclick="removeGrowthImage(${index}, ${i})" class="absolute inset-0 bg-black/50 text-white flex items-center justify-center opacity-0 group-hover/img:opacity-100 transition-opacity z-20"><span class="material-symbols-outlined text-xl">delete</span></button>
                            </div>
                        `;
                    });
                    imagesHTML += `</div>`;
                } else {
                    const emptyAspectClass = step.aspect === 'portrait' ? 'aspect-[3/4] w-2/3 mx-auto' : 'aspect-video w-full';
                    imagesHTML = `
                        <div class="${emptyAspectClass} bg-gray-100 rounded-lg border border-dashed border-gray-300 flex items-center justify-center mb-2 transition-all">
                            <span class="text-sm text-gray-400">이미지 없음</span>
                        </div>
                    `;
                }

                const uploadBtn = images.length < 4 
                    ? `<button onclick="uploadImage('growth', ${index})" class="text-xs bg-primary/10 text-primary py-2 rounded font-bold hover:bg-primary/20 w-full transition-colors flex items-center justify-center gap-1"><span class="material-symbols-outlined text-sm">add_photo_alternate</span> 사진 추가 (${images.length}/4)</button>`
                    : `<div class="text-xs text-center text-outline py-2 border border-outline-variant/30 rounded bg-background">최대 4장 업로드 완료</div>`;

                return `
                    <div class="p-5 border border-outline-variant/50 rounded-xl bg-background relative flex flex-col md:flex-row gap-4 group">
                        <button onclick="removeStep(${index})" class="absolute top-2 right-2 text-red-400 hover:text-red-600 hidden group-hover:block"><span class="material-symbols-outlined">delete</span></button>
                        <div class="w-full md:w-1/3 flex flex-col">
                            ${ratioHTML}
                            ${imagesHTML}
                            ${uploadBtn}
                        </div>
                        <div class="w-full md:w-2/3 flex flex-col gap-3 pt-2">
                            <span class="text-xs font-bold text-outline">STEP ${String(index + 1).padStart(2, '0')}</span>
                            <input type="text" value="${escAttr(step.title)}" onchange="updateData('growth', ${index}, 'title', this.value)" placeholder="스텝 소제목" class="w-full border-b border-outline-variant/30 focus:border-primary bg-transparent py-1 text-primary font-bold">
                            <textarea onchange="updateData('growth', ${index}, 'desc', this.value)" placeholder="설명을 입력하세요..." class="w-full flex-1 border border-outline-variant/30 rounded-lg p-2 text-sm resize-none focus:ring-1 focus:ring-primary">${escAttr(step.desc)}</textarea>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        window.addStep = function() { growthSteps.push({ images: [], title: '', desc: '', aspect: 'landscape' }); isDirty = true; renderSteps(); }
        window.removeStep = function(index) { growthSteps.splice(index, 1); isDirty = true; renderSteps(); }
        window.removeGrowthImage = function(stepIndex, imgIndex) { growthSteps[stepIndex].images.splice(imgIndex, 1); isDirty = true; renderSteps(); }

        // 드래그 앤 드롭 함수들
        window.dragStart = function(e, stepIndex, imgIndex) {
            dragSrcStepIndex = stepIndex;
            dragSrcImgIndex = imgIndex;
            e.dataTransfer.effectAllowed = 'move';
        };

        window.dragOver = function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        };

        window.drop = function(e, stepIndex, targetImgIndex) {
            e.preventDefault();
            e.stopPropagation();
            if (dragSrcStepIndex === stepIndex && dragSrcImgIndex !== targetImgIndex) {
                const imagesArray = growthSteps[stepIndex].images;
                const draggedItem = imagesArray.splice(dragSrcImgIndex, 1)[0];
                imagesArray.splice(targetImgIndex, 0, draggedItem);
                isDirty = true;
                renderSteps();
            }
        };

        function renderUsage() {
            const container = document.getElementById('usageContainer');
            container.innerHTML = usageSteps.map((use, index) => `
                    <div class="p-4 border border-outline-variant/50 rounded-xl bg-background relative flex flex-col gap-3 group">
                        <button onclick="removeUsage(${index})" class="absolute top-2 right-2 text-red-400 hover:text-red-600 hidden group-hover:block z-10"><span class="material-symbols-outlined">delete</span></button>
                        <div class="aspect-video bg-gray-100 rounded-lg border border-dashed border-gray-300 flex items-center justify-center overflow-hidden relative">
                            ${use.img ? `<img src="${escAttr(use.img)}" alt="" class="w-full h-full object-cover">` : `<span class="text-sm text-gray-400">사진 등록</span>`}
                        </div>
                        <div class="flex gap-2 w-full">
                            <button onclick="uploadImage('usage', ${index})" class="flex-1 text-xs bg-amber-100 text-amber-800 py-1.5 rounded font-bold hover:bg-amber-200 transition-colors">카드 사진 업로드</button>
                            ${use.img ? `<button onclick="removeUsageImage(${index})" class="text-xs border border-outline-variant/50 text-outline py-1.5 px-3 rounded font-bold hover:bg-red-50 hover:text-red-500 hover:border-red-200 transition-colors">사진 삭제</button>` : ''}
                        </div>
                        <input type="text" value="${escAttr(use.title)}" onchange="updateData('usage', ${index}, 'title', this.value)" placeholder="예: 따뜻한 차로" class="w-full border-b border-outline-variant/30 focus:border-primary bg-transparent py-1 text-primary font-bold text-sm">
                        <textarea onchange="updateData('usage', ${index}, 'desc', this.value)" placeholder="예: 뜨거운 물 1L에 2조각을 넣고..." class="w-full flex-1 border border-outline-variant/30 rounded-lg p-2 text-sm resize-none focus:ring-1 focus:ring-primary h-20">${escAttr(use.desc)}</textarea>
                    </div>
                `).join('');
        }
        window.addUsage = function() { usageSteps.push({ img: '', title: '', desc: '' }); isDirty = true; renderUsage(); }
        window.removeUsage = function(index) { usageSteps.splice(index, 1); isDirty = true; renderUsage(); }
        window.removeUsageImage = function(index) { usageSteps[index].img = ''; isDirty = true; renderUsage(); }

        window.updateData = function(type, index, field, value) {
            isDirty = true;
            if(type === 'growth') {
                growthSteps[index][field] = value;
                if(field === 'aspect') renderSteps();
            }
            if(type === 'usage') usageSteps[index][field] = value;
        }

        window.uploadImage = function(type, index) {
            if(type === 'growth') {
                if(!growthSteps[index].images) growthSteps[index].images = [];
                if(growthSteps[index].images.length >= 4) return alert('최대 4장까지 업로드 가능합니다.');
            }

            const input = document.createElement('input'); 
            input.setAttribute('type', 'file'); 
            input.setAttribute('accept', 'image/*'); 
            if(type === 'growth') input.setAttribute('multiple', 'true'); // 다중 파일 선택 추가
            
            input.click();
            
            input.onchange = async () => {
                if (!input.files || input.files.length === 0) return;
                
                if (type === 'growth') {
                    const maxAllowed = 4 - growthSteps[index].images.length;
                    const filesToUpload = Array.from(input.files).slice(0, maxAllowed);
                    
                    if (input.files.length > maxAllowed) {
                        alert(`최대 4장까지만 업로드 가능합니다. 초과된 사진은 제외하고 업로드됩니다.`);
                    }

                    for (const rawFile of filesToUpload) {
                        try {
                            const file = await HY.resizeImage(rawFile, 1600, 0.85);
                            const ext = file.type === 'image/jpeg' ? 'jpg' : (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
                            const filePath = `post_images/${uid()}.${ext || 'jpg'}`;
                            const { error } = await supabaseClient.storage.from('images').upload(filePath, file, { contentType: file.type });
                            if (error) throw error;
                            const { data } = supabaseClient.storage.from('images').getPublicUrl(filePath);
                            growthSteps[index].images.push(data.publicUrl);
                            isDirty = true;
                            renderSteps();
                        } catch (error) {
                            alert('사진 업로드 실패: ' + (error.message || error));
                        }
                    }
                } else if (type === 'usage') {
                    try {
                        const file = await HY.resizeImage(input.files[0], 1600, 0.85);
                        const ext = file.type === 'image/jpeg' ? 'jpg' : (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
                        const filePath = `post_images/${uid()}.${ext || 'jpg'}`;
                        const { error } = await supabaseClient.storage.from('images').upload(filePath, file, { contentType: file.type });
                        if (error) throw error;
                        const { data } = supabaseClient.storage.from('images').getPublicUrl(filePath);
                        usageSteps[index].img = data.publicUrl;
                        isDirty = true;
                        renderUsage();
                    } catch (error) {
                        alert('사진 업로드 실패: ' + (error.message || error));
                    }
                }
            };
        }

        async function loadPostData() {
            const urlParams = new URLSearchParams(window.location.search);
            postId = urlParams.get('id');

            if (postId) {
                const { data: post, error } = await supabaseClient.from('posts').select('*').eq('id', postId).single();
                if (error || !post) {
                    alert('글을 불러오지 못했습니다. 목록으로 돌아갑니다.\n' + (error ? error.message : ''));
                    window.location.href = 'dashboard.html';
                    return;
                }
                {
                    document.getElementById('postTitle').value = post.title || '';

                    try {
                        const growthData = JSON.parse(post.content_growth);
                        if (growthData.layout) {
                            const layoutRadio = document.querySelector(`input[name="layoutType"][value="${growthData.layout}"]`);
                            if (layoutRadio) layoutRadio.checked = true;
                        }

                        if (growthData.steps) {
                            growthSteps = growthData.steps.map(step => {
                                if (step.img && (!step.images || step.images.length === 0)) step.images = [step.img];
                                if (!step.images) step.images = [];
                                if (!step.aspect) step.aspect = 'landscape';
                                return step;
                            });
                        }
                    } catch (e) { if(post.content_growth) growthSteps = [{ images: [], title: '과거 기록', desc: '과거 데이터입니다.', aspect: 'landscape' }]; }
                    
                    try {
                        const usageData = JSON.parse(post.content_usage);
                        if(Array.isArray(usageData)) usageSteps = usageData;
                    } catch(e) { usageSteps = []; }
                }
            }
            if(growthSteps.length === 0) addStep(); else renderSteps();
            if(usageSteps.length === 0) addUsage(); else renderUsage();
            isDirty = false;
        }

        window.savePost = async function(status) {
            const title = document.getElementById('postTitle').value.trim();
            const selectedLayout = document.querySelector('input[name="layoutType"]:checked').value;

            if (!title) return alert('대제목을 입력해 주세요.');

            const growthPayload = JSON.stringify({ layout: selectedLayout, steps: growthSteps });
            const usagePayload = JSON.stringify(usageSteps); 

            let thumbnailUrl = null;
            if (growthSteps.length > 0) {
                if(growthSteps[0].images && growthSteps[0].images.length > 0) thumbnailUrl = growthSteps[0].images[0];
                else if (growthSteps[0].img) thumbnailUrl = growthSteps[0].img;
            }

            const postData = {
                title: title,
                content_growth: growthPayload, 
                content_usage: usagePayload,
                status: status,
                thumbnail_url: thumbnailUrl
            };

            const btnPublish = document.getElementById('btnPublish');
            const btnDraft = document.getElementById('btnDraft');
            btnPublish.disabled = true; btnDraft.disabled = true;

            // Supabase 클라이언트는 오류를 throw 하지 않고 { data, error } 로 돌려준다.
            // 반드시 error / data 를 직접 확인해야 "저장 안 됐는데 성공 메시지" 를 막을 수 있다.
            const res = postId
                ? await supabaseClient.from('posts').update(postData).eq('id', postId).select()
                : await supabaseClient.from('posts').insert([postData]).select();

            if (res.error || !res.data || res.data.length === 0) {
                const msg = res.error ? res.error.message
                    : '저장 권한이 없거나 로그인 세션이 만료되었습니다. 다시 로그인해 주세요.';
                alert('저장 실패: ' + msg);
                btnPublish.disabled = false; btnDraft.disabled = false;
                return;
            }

            if (!postId && res.data[0] && res.data[0].id) postId = res.data[0].id;
            isDirty = false;
            alert(status === 'published' ? '홈페이지에 정상 발행되었습니다.' : '임시저장 되었습니다.');
            window.location.href = 'dashboard.html';
        };

        // 저장하지 않고 페이지를 벗어나려 하면 경고
        document.getElementById('postTitle').addEventListener('input', () => { isDirty = true; });
        window.addEventListener('beforeunload', (e) => {
            if (isDirty) { e.preventDefault(); e.returnValue = ''; }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            if (await checkAuth()) loadPostData();
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../sw.js')
                    .then(registration => console.log('ServiceWorker registration successful'))
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }
    </script>
