<body class="bg-background text-on-background font-body-md antialiased overflow-x-hidden min-h-screen flex flex-col">

        <div class="relative flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 max-w-container-max mx-auto w-full">
            <a class="flex items-center gap-3 z-10 hover:opacity-90 transition-opacity" href="index.html">

    <main class="flex-1 pt-[100px] md:pt-[140px]">
        
        <section class="px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto reveal">
            <div class="text-center mb-10">
                <h2 class="headline-font text-2xl md:text-3xl text-primary font-medium mb-2">전체 게시글 보기</h2>
                <div class="w-12 h-0.5 bg-primary/20 mx-auto mt-4"></div>
            </div>

            <div class="bg-surface p-4 md:p-5 rounded-2xl border border-outline-variant/30 mb-10 flex flex-col md:flex-row gap-4 ambient-shadow">
                <div class="flex-1">
                    <label class="block text-xs font-bold text-primary mb-1.5 ml-1">포스트 검색</label>
                    <input type="text" id="searchTitle" placeholder="이름으로 검색..." class="w-full px-4 py-2.5 text-sm bg-background border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                </div>
                <div class="w-full md:w-48">
                    <label class="block text-xs font-bold text-primary mb-1.5 ml-1">작성일자</label>
                    <input type="date" id="searchDate" class="w-full px-4 py-2.5 text-sm bg-background border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all text-outline">
                </div>
                <div class="w-full md:w-40">
                    <label class="block text-xs font-bold text-primary mb-1.5 ml-1">정렬 순서</label>
                    <select id="sortOrder" class="w-full px-4 py-2.5 text-sm bg-background border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                        <option value="desc">최신순</option>
                        <option value="asc">과거순</option>
                    </select>
                </div>
                <div class="w-full md:w-auto flex items-end">
                    <button onclick="loadMainContents()" class="w-full md:w-auto bg-primary text-white px-6 py-2.5 rounded-xl text-sm font-bold tracking-wide hover:opacity-90 active:scale-95 transition-all h-[42px] flex items-center justify-center gap-1">
                        <span class="material-symbols-outlined text-base">search</span> 검색
                    </button>
                </div>
            </div>

            <div id="storyLoading" class="text-center py-12 text-on-surface-variant">게시글을 불러오는 중입니다...</div>
            
            <div id="blogListContainer" class="flex flex-col gap-8 hidden mb-16"></div>
            
            <div id="storyEmpty" class="hidden text-center py-16 text-on-surface-variant bg-surface-container-low rounded-xl mb-16">
                <span class="material-symbols-outlined text-4xl mb-2 opacity-50 block">search_off</span>
                조건에 맞는 게시글이 없습니다.
            </div>

    <footer class="w-full py-16 px-margin-mobile md:px-margin-desktop flex flex-col items-center text-center gap-8 bg-surface-container-lowest border-t border-surface-container-low mt-auto">

    <script>
        const SUPABASE_URL = "https://eyoahkbqfxcisvmkvikp.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5b2Foa2JxZnhjaXN2bWt2aWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NDAzODUsImV4cCI6MjA5NTAxNjM4NX0.-JgH5ACzfq-d96VXEZlXovXx0w_uR3gJiwonaushah8";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function initScrollReveal() {
            setTimeout(() => {
                const reveals = document.querySelectorAll(".reveal");
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('active'); });
                }, { threshold: 0.1 });
                reveals.forEach(el => observer.observe(el));
            }, 100);
        }

        async function loadMainContents() {
            const loadingIndicator = document.getElementById('storyLoading');
            const listContainer = document.getElementById('blogListContainer');
            const emptyState = document.getElementById('storyEmpty');

            loadingIndicator.classList.remove('hidden');
            listContainer.classList.add('hidden');
            emptyState.classList.add('hidden');

            const searchTitle = document.getElementById('searchTitle').value.trim();
            const searchDate = document.getElementById('searchDate').value;
            const sortOrder = document.getElementById('sortOrder').value;

            try {
                let query = supabaseClient.from('posts').select('*').eq('status', 'published');
                
                if (sortOrder === 'asc') query = query.order('created_at', { ascending: true });
                else query = query.order('created_at', { ascending: false });

                if (searchTitle) query = query.ilike('title', `%${searchTitle}%`);

                const { data: posts, error } = await query;
                if (error) throw error;

                let filteredPosts = posts || [];

                if (searchDate) {
                    filteredPosts = filteredPosts.filter(post => {
                        const dateObj = new Date(post.created_at);
                        const year = dateObj.getFullYear();
                        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                        const day = String(dateObj.getDate()).padStart(2, '0');
                        const formattedLocal = `${year}-${month}-${day}`;
                        return formattedLocal === searchDate;
                    });
                }

                loadingIndicator.classList.add('hidden');

                if (filteredPosts.length === 0) { 
                    emptyState.classList.remove('hidden'); 
                    return; 
                }

                listContainer.classList.remove('hidden');
                listContainer.innerHTML = '';

                filteredPosts.forEach(post => {
                    let firstImg = './assets/icon1.png'; 
                    let plainText = '';
                    try {
                        const growthData = JSON.parse(post.content_growth);
                        if(growthData.steps && growthData.steps.length > 0) {
                            if(growthData.steps[0].img) firstImg = growthData.steps[0].img;
                            plainText = growthData.steps[0].desc || '';
                        }
                    } catch(e) {
                        const tempDiv = document.createElement('div'); tempDiv.innerHTML = post.content_growth || '';
                        const img = tempDiv.querySelector('img'); if(img) firstImg = img.src;
                        plainText = tempDiv.innerText || '';
                    }

                    if(plainText.length > 120) plainText = plainText.substring(0, 120) + '...';
                    const dateOpts = { year: 'numeric', month: 'long', day: 'numeric' };
                    const dateStr = new Date(post.created_at).toLocaleDateString('ko-KR', dateOpts);

                    const postHTML = `
                        <div class="reveal flex flex-col-reverse md:flex-row gap-6 md:gap-8 py-8 border-b border-outline-variant/30 cursor-pointer group hover:bg-surface-container-low/50 px-4 md:px-6 rounded-2xl transition-colors" onclick="window.location.href='detail.html?id=${post.id}'">
                            <div class="flex-1 flex flex-col justify-center">
                                <div class="flex items-center gap-2.5 mb-3">
                                    <div class="w-8 h-8 rounded-full overflow-hidden bg-white border border-outline-variant/30 shrink-0">
                                        <img src="./assets/icon1.png" class="w-full h-full object-cover p-0.5">
                                    </div>
                                    <span class="font-bold text-sm text-primary">하늘향</span>
                                    <span class="text-xs text-outline font-medium">${dateStr}</span>
                                </div>
                                <h3 class="korean-serif text-2xl md:text-3xl font-medium text-primary mb-3 group-hover:text-surface-tint transition-colors">${post.title}</h3>
                                <p class="font-body-md text-base text-on-surface-variant line-clamp-3 leading-relaxed">${plainText}</p>
                            </div>
                            <div class="w-full md:w-[220px] lg:w-[260px] aspect-[4/3] shrink-0 rounded-xl overflow-hidden bg-surface-variant">
                                <img src="${firstImg}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                            </div>
                        </div>
                    `;
                    listContainer.innerHTML += postHTML;
                });
            } catch (error) { console.error(error); } finally { initScrollReveal(); }
        }
        document.addEventListener('DOMContentLoaded', loadMainContents);
    </script>
</body>
