<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>하늘향 - 전체 게시글</title>
    <meta name="description" content="하늘향의 모든 성장 일지와 제품 이력 기록을 모아봅니다."/>
    <link rel="canonical" href="https://haneulhyang.shop/list.html"/>
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="하늘향"/>
    <meta property="og:title" content="하늘향 - 전체 게시글"/>
    <meta property="og:description" content="하늘향의 모든 성장 일지와 제품 이력 기록."/>
    <meta property="og:url" content="https://haneulhyang.shop/list.html"/>
    <meta property="og:image" content="https://haneulhyang.shop/assets/icon1.png"/>
    <meta name="twitter:card" content="summary"/>

    <link rel="icon" type="image/png" href="./assets/favicon-32.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#17341c">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">

    <script>
        (function () {
            try {
                var m = localStorage.getItem('hy-theme') || 'system';
                var d = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.toggle('dark', d);
            } catch (e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"/>

    <link rel="stylesheet" href="./assets/tailwind.css">
</head>
<body class="bg-background text-on-background font-body-md antialiased overflow-x-hidden min-h-screen flex flex-col">

    <nav class="fixed top-0 inset-x-0 w-full z-50 bg-background/80 backdrop-blur-md border-b border-outline-variant/30">
        <div class="relative flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 max-w-container-max mx-auto w-full">
            <a class="flex items-center gap-3 z-10 hover:opacity-90 transition-opacity" href="index.html">
                <div class="h-12 w-12 md:h-14 md:w-14 rounded-2xl overflow-hidden bg-white shadow-sm border border-outline-variant/20 shrink-0">
                    <img alt="하늘향 로고" class="h-full w-full object-cover p-1" src="./assets/icon1.png" width="56" height="56"/>
                </div>
                <span class="headline-font text-base md:text-lg font-bold text-primary tracking-wider">하늘향</span>
            </a>
            <div class="flex justify-end items-center gap-1 z-10">
                <button id="themeToggle" type="button" class="w-9 h-9 md:w-11 md:h-11 flex items-center justify-center rounded-full text-primary hover:bg-primary/10 transition-colors" aria-label="테마 전환">
                    <span class="material-symbols-outlined text-xl md:text-2xl">brightness_auto</span>
                </button>
                <a href="https://www.band.us/band/67603330/intro" target="_blank" rel="noopener noreferrer" class="group block w-9 h-9 md:w-11 md:h-11 transition-transform duration-300 hover:scale-110" title="하늘향 밴드 바로가기">
                    <img src="./assets/band.png" alt="네이버 밴드" class="w-full h-full object-contain block group-hover:hidden">
                    <img src="./assets/band_hover.png" alt="네이버 밴드" class="w-full h-full object-contain hidden group-hover:block">
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-1 pt-[100px] md:pt-[140px]">

        <section class="px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto reveal">
            <div class="text-center mb-10">
                <h1 class="headline-font text-2xl md:text-3xl text-primary font-medium mb-2">전체 게시글 보기</h1>
                <div class="w-12 h-0.5 bg-primary/20 mx-auto mt-4"></div>
            </div>

            <form id="searchForm" class="bg-surface-container-lowest p-4 md:p-5 rounded-2xl border border-outline-variant/30 mb-10 flex flex-col md:flex-row gap-4 ambient-shadow">
                <div class="flex-1">
                    <label for="searchTitle" class="block text-xs font-bold text-primary mb-1.5 ml-1">포스트 검색</label>
                    <input type="text" id="searchTitle" placeholder="이름으로 검색..." class="w-full px-4 py-2.5 text-sm bg-background border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                </div>
                <div class="w-full md:w-48">
                    <label for="searchDate" class="block text-xs font-bold text-primary mb-1.5 ml-1">작성일자</label>
                    <input type="date" id="searchDate" class="w-full px-4 py-2.5 text-sm bg-background border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all text-outline">
                </div>
                <div class="w-full md:w-40">
                    <label for="sortOrder" class="block text-xs font-bold text-primary mb-1.5 ml-1">정렬 순서</label>
                    <select id="sortOrder" class="w-full px-4 py-2.5 text-sm bg-background border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                        <option value="desc">최신순</option>
                        <option value="asc">과거순</option>
                    </select>
                </div>
                <div class="w-full md:w-auto flex items-end">
                    <button type="submit" class="w-full md:w-auto bg-primary text-on-primary px-6 py-2.5 rounded-xl text-sm font-bold tracking-wide hover:opacity-90 active:scale-95 transition-all h-[42px] flex items-center justify-center gap-1">
                        <span class="material-symbols-outlined text-base">search</span> 검색
                    </button>
                </div>
            </form>

            <div id="storyLoading" class="text-center py-12 text-on-surface-variant">게시글을 불러오는 중입니다...</div>

            <div id="blogListContainer" class="flex flex-col gap-8 hidden mb-16"></div>

            <div id="storyError" class="hidden text-center py-16 text-on-surface-variant bg-surface-container-low rounded-xl mb-16">
                <span class="material-symbols-outlined text-4xl mb-2 opacity-50 block">cloud_off</span>
                게시글을 불러오지 못했습니다.
                <div class="mt-4"><button type="button" onclick="loadMainContents()" class="px-5 py-2 text-sm font-bold border border-outline-variant text-primary rounded-xl hover:bg-primary hover:text-on-primary transition-colors">다시 시도</button></div>
            </div>

            <div id="storyEmpty" class="hidden text-center py-16 text-on-surface-variant bg-surface-container-low rounded-xl mb-16">
                <span class="material-symbols-outlined text-4xl mb-2 opacity-50 block">search_off</span>
                조건에 맞는 게시글이 없습니다.
            </div>
        </section>

    </main>

    <footer class="w-full py-16 px-margin-mobile md:px-margin-desktop flex flex-col items-center text-center gap-8 bg-surface-container-lowest border-t border-surface-container-low mt-auto">
        <div class="flex flex-col items-center gap-6">
            <a class="block h-20 w-20 rounded-2xl overflow-hidden bg-white shadow-md border border-outline-variant/20" href="index.html">
                <img alt="하늘향 로고" class="h-full w-full object-cover p-1" src="./assets/icon1.png" width="80" height="80"/>
            </a>
            <span class="font-body-md text-body-md text-secondary">© <span id="footerYear">2026</span> 하늘향 PREMIUM WELLNESS. ALL RIGHTS RESERVED.</span>
        </div>
        <ul class="flex flex-col md:flex-row gap-6 font-body-md text-body-md text-on-surface-variant justify-center">
            <li><a class="hover:text-primary transition-colors" href="admin/login.html">관리자 시스템 접속</a></li>
        </ul>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/app.js"></script>
    <script>
        document.getElementById('footerYear').textContent = new Date().getFullYear();
        HY.registerSW('./sw.js');

        async function loadMainContents() {
            const loadingIndicator = document.getElementById('storyLoading');
            const listContainer = document.getElementById('blogListContainer');
            const emptyState = document.getElementById('storyEmpty');
            const errorState = document.getElementById('storyError');

            loadingIndicator.classList.remove('hidden');
            listContainer.classList.add('hidden');
            emptyState.classList.add('hidden');
            errorState.classList.add('hidden');

            const searchTitle = document.getElementById('searchTitle').value.trim();
            const searchDate = document.getElementById('searchDate').value;
            const sortOrder = document.getElementById('sortOrder').value;

            try {
                let query = HY.supa()
                    .from('posts')
                    .select('id, title, content_growth, thumbnail_url, created_at')
                    .eq('status', 'published')
                    .order('created_at', { ascending: sortOrder === 'asc' });

                if (searchTitle) query = query.ilike('title', `%${searchTitle}%`);

                const { data: posts, error } = await query;
                if (error) throw error;

                let filteredPosts = posts || [];
                if (searchDate) {
                    filteredPosts = filteredPosts.filter(post => {
                        const d = new Date(post.created_at);
                        const local = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                        return local === searchDate;
                    });
                }

                loadingIndicator.classList.add('hidden');

                if (filteredPosts.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                listContainer.classList.remove('hidden');
                listContainer.innerHTML = filteredPosts.map(renderPostRow).join('');
            } catch (error) {
                console.error(error);
                loadingIndicator.classList.add('hidden');
                errorState.classList.remove('hidden');
            } finally {
                HY.initReveal();
            }
        }

        function renderPostRow(post) {
            let firstImg = post.thumbnail_url || './assets/icon1.png';
            let plainText = '';
            try {
                const growthData = JSON.parse(post.content_growth);
                if (growthData.steps && growthData.steps.length > 0) {
                    const s0 = growthData.steps[0];
                    if (s0.images && s0.images.length) firstImg = s0.images[0];
                    else if (s0.img) firstImg = s0.img;
                    plainText = s0.desc || '';
                }
            } catch (e) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = post.content_growth || '';
                const img = tempDiv.querySelector('img');
                if (img) firstImg = img.src;
                plainText = tempDiv.innerText || '';
            }
            if (plainText.length > 120) plainText = plainText.substring(0, 120) + '...';

            return `
                <a href="detail.html?id=${encodeURIComponent(post.id)}" class="reveal flex flex-col-reverse md:flex-row gap-6 md:gap-8 py-8 border-b border-outline-variant/30 group hover:bg-surface-container-low/50 px-4 md:px-6 rounded-2xl transition-colors">
                    <div class="flex-1 flex flex-col justify-center">
                        <div class="flex items-center gap-2.5 mb-3">
                            <span class="w-8 h-8 rounded-full overflow-hidden bg-white border border-outline-variant/30 shrink-0">
                                <img src="./assets/icon1.png" alt="" class="w-full h-full object-cover p-0.5" width="32" height="32">
                            </span>
                            <span class="font-bold text-sm text-primary">하늘향</span>
                            <span class="text-xs text-outline font-medium">${HY.fmtDate(post.created_at)}</span>
                        </div>
                        <h2 class="korean-serif text-2xl md:text-3xl font-medium text-primary mb-3 group-hover:text-surface-tint transition-colors">${HY.esc(post.title)}</h2>
                        <p class="font-body-md text-base text-on-surface-variant line-clamp-3 leading-relaxed">${HY.esc(plainText)}</p>
                    </div>
                    <div class="w-full md:w-[220px] lg:w-[260px] aspect-[4/3] shrink-0 rounded-xl overflow-hidden bg-surface-variant">
                        <img src="${HY.safeImg(firstImg)}" alt="" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                    </div>
                </a>
            `;
        }

        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            loadMainContents();
        });
        document.addEventListener('DOMContentLoaded', loadMainContents);
    </script>
</body>
</html>
