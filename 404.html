<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>하늘향 - 페이지를 찾을 수 없습니다</title>
    <link rel="icon" type="image/png" href="/assets/favicon-32.png">
    <meta name="theme-color" content="#17341c">
    <meta name="robots" content="noindex">
    <script>
        (function () {
            try {
                var m = localStorage.getItem('hy-theme') || 'system';
                var d = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.toggle('dark', d);
            } catch (e) {}
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/tailwind.css">
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center px-6">
    <div class="text-center max-w-sm">
        <div class="h-16 w-16 mx-auto mb-6 rounded-2xl overflow-hidden bg-white shadow-md border border-outline-variant/20">
            <img src="/assets/icon1.png" alt="하늘향" class="h-full w-full object-cover p-1">
        </div>
        <h1 class="korean-serif text-2xl text-primary mb-3">페이지를 찾을 수 없습니다</h1>
        <p class="text-sm text-on-surface-variant leading-relaxed mb-6">
            주소가 잘못되었거나 삭제된 페이지일 수 있습니다.<br>QR 코드가 인식되지 않는다면 다시 스캔해 주세요.
        </p>
        <a href="/index.html" class="inline-block px-6 py-3 bg-primary text-on-primary rounded-xl text-sm font-bold tracking-wide hover:opacity-90 transition-opacity">
            하늘향 홈으로
        </a>
    </div>
</body>
</html>
